<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Daily word • Enigma Wellbeing</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />

  <style>
    .word-card{
      position: relative;
      text-align: center;
      padding-bottom: 56px; /* room for 💜 */
    }
    .word-title{
      font-size: 26px;
      margin: 6px 0 8px;
      font-weight: 700;
      letter-spacing: .2px;
    }
    .word-meaning{
      font-size: 15px;
      opacity: .75;
      margin: 0 0 10px;
      line-height: 1.5;
    }
    .divider{
      height:1px;
      background: rgba(0,0,0,.08);
      margin: 14px 0;
    }
    body.dark .divider{ background: rgba(255,255,255,.12); }

    .yesterday{
      font-size: 14px;
      opacity: .75;
      margin: 0;
      line-height: 1.45;
    }

    .save-heart{
      position: absolute;
      right: 12px;
      bottom: 12px;
      width: 44px;
      height: 44px;
      border-radius: 999px;
      border: 1px solid var(--stroke);
      background: var(--card);
      box-shadow: var(--shadow2);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 18px;
      user-select: none;
    }
    .save-heart[aria-pressed="true"]{
      background: var(--accentTint);
      outline: 2px solid var(--accentRing);
      outline-offset: 2px;
    }

    .saved-panel{
      margin-top: 14px;
      display:flex;
      flex-direction: column;
      gap: 10px;
    }
    .saved-item{
      width: 100%;
      text-align:left;
      display:flex;
      align-items:flex-start;
      gap: 12px;
    }
    .saved-item .ico{ font-size: 20px; width: 34px; text-align:center; }
    .saved-item .t{ font-weight:600; margin:0; }
    .saved-item .m{ margin:2px 0 0; opacity:.72; font-size: 13px; line-height: 1.45; }
    .small-btn{
      border:none;
      background: transparent;
      text-decoration: underline;
      cursor:pointer;
      font: inherit;
      opacity:.75;
      padding: 6px 8px;
      border-radius: 10px;
      align-self: flex-end;
    }
  </style>
</head>

<body>
  <div class="watermark" aria-hidden="true"></div>

  <main class="wrap">

    <div class="topbar">
      <a class="back" href="index.html">←</a>
      <div style="width:44px;"></div>
    </div>

    <h1 style="margin-bottom:6px;">Daily word</h1>
    <p class="page-sub">A gentle word for today.</p>

    <section class="card word-card" id="wordCard">
      <div class="word-title" id="word">—</div>
      <div class="word-meaning" id="meaning">—</div>

      <div class="divider"></div>

      <p class="yesterday" id="yesterday">Yesterday: —</p>

      <button class="save-heart" id="saveBtn" type="button" aria-pressed="false" aria-label="Save this word">
        💜
      </button>
    </section>

    <section class="card" style="margin-top:14px;">
      <div style="display:flex; justify-content:space-between; align-items:center; gap:10px;">
        <div>
          <div class="label" style="font-weight:700;">Saved words</div>
          <div class="page-sub" style="margin:4px 0 0;">Your favourites in one place.</div>
        </div>
        <button class="small-btn" id="clearSaved" type="button">Clear</button>
      </div>

      <div class="saved-panel" id="savedList"></div>
    </section>

  </main>

  <script type="module">
    import { applySavedTheme, applySavedPreferences } from "./app.js";
    applySavedTheme();
    applySavedPreferences();
  </script>

  <script>
    // ✅ Keep your same words list
    const WORDS = [
      { w:"Gentle", m:"Soft, kind, not forced." },
      { w:"Steady", m:"Stable and grounded." },
      { w:"Release", m:"Let tension soften." },
      { w:"Pause", m:"A moment before the next step." },
      { w:"Enough", m:"You don’t have to earn rest." },
      { w:"Anchor", m:"Something that brings you back." },
      { w:"Breathe", m:"Slow in, slower out." },
      { w:"Patience", m:"Allow time to unfold." },
      { w:"Compassion", m:"Kindness toward yourself." },
      { w:"Balance", m:"Not too much, not too little." },
      { w:"Presence", m:"Here, not ahead." },
      { w:"Trust", m:"Belief in your own strength." },

      { w:"Reset", m:"Begin again, softly." },
      { w:"Clarity", m:"Seeing without overwhelm." },
      { w:"Grounded", m:"Connected to the present moment." },
      { w:"Stillness", m:"Calm without pressure." },
      { w:"Courage", m:"Brave in small ways." },
      { w:"Light", m:"Less heavy than before." },
      { w:"Hope", m:"Possibility ahead." },
      { w:"Grace", m:"Room for imperfection." },
      { w:"Restore", m:"Rebuild your energy." },
      { w:"Kindness", m:"Toward yourself first." },
      { w:"Flow", m:"Move without forcing." },
      { w:"Ease", m:"Let it be simpler." },
      { w:"Strength", m:"You have more than you think." },
      { w:"Support", m:"You don’t have to do it alone." },
      { w:"Soften", m:"Relax the tension." },
      { w:"Focus", m:"One small thing at a time." },
      { w:"Space", m:"Give yourself room." },
      { w:"Calm", m:"Quiet inside the noise." },
      { w:"Align", m:"Move in a way that feels right." },
      { w:"Reflect", m:"Notice without judgment." },
      { w:"Rebuild", m:"Piece by piece." },
      { w:"Intent", m:"Move with purpose." },
      { w:"Safe", m:"In this moment, you are okay." },
      { w:"Open", m:"Allow possibility in." },
      { w:"Slow", m:"There is no rush." },
      { w:"Release", m:"You can let that go." },
      { w:"Bloom", m:"Growth takes time." },
      { w:"Reconnect", m:"Come back to yourself." },
      { w:"Stability", m:"Solid ground beneath you." },
      { w:"Warmth", m:"Gentle comfort." },
      { w:"Acceptance", m:"It is what it is — and that’s okay." },
      { w:"Restore", m:"Energy can return." },
      { w:"Renew", m:"Fresh start energy." },
      { w:"Listen", m:"To yourself first." },
      { w:"Belong", m:"You are not alone." },
      { w:"Patience", m:"Growth isn’t instant." },
      { w:"Exhale", m:"Let your shoulders drop." },
      { w:"Caring", m:"Be on your own side." },
      { w:"Progress", m:"Small movement still counts." },
      { w:"Shift", m:"Change one small thing." },
      { w:"Heal", m:"Not perfect — just healing." },
      { w:"Create", m:"Make space for something new." },
      { w:"Stabilise", m:"Bring yourself back to centre." },
      { w:"Quiet", m:"Lower the noise." },
      { w:"Allow", m:"You don’t need to fight this." },
      { w:"Gratitude", m:"Notice what is steady." },
      { w:"Strengthen", m:"Build slowly." },
      { w:"Rooted", m:"Grounded and steady." }
    ];

    const TODAY_KEY = "enigma_daily_word_today_v2";
    const SAVED_KEY = "enigma_saved_words_v2";

    const wordEl = document.getElementById("word");
    const meaningEl = document.getElementById("meaning");
    const yesterdayEl = document.getElementById("yesterday");
    const saveBtn = document.getElementById("saveBtn");
    const savedList = document.getElementById("savedList");
    const clearSaved = document.getElementById("clearSaved");

    function dayId(d=new Date()){
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth()+1).padStart(2,"0");
      const dd = String(d.getDate()).padStart(2,"0");
      return `${yyyy}-${mm}-${dd}`;
    }

    function hashToIndex(str, mod){
      let h = 0;
      for (let i=0;i<str.length;i++){
        h = (h * 31 + str.charCodeAt(i)) >>> 0;
      }
      return h % mod;
    }

    function getWordForDate(date){
      const id = dayId(date);
      const idx = hashToIndex(id, WORDS.length);
      return WORDS[idx];
    }

    function loadSaved(){
      try { return JSON.parse(localStorage.getItem(SAVED_KEY) || "[]"); }
      catch { return []; }
    }

    function saveSaved(arr){
      localStorage.setItem(SAVED_KEY, JSON.stringify(arr));
    }

    const today = new Date();
    const yesterday = new Date();
    yesterday.setDate(today.getDate() - 1);

    const todaysWord = getWordForDate(today);
    const yesterdaysWord = getWordForDate(yesterday);

    // store today selection (optional, but handy for other pages)
    localStorage.setItem(TODAY_KEY, JSON.stringify({ date: dayId(today), ...todaysWord }));

    // render today + yesterday
    wordEl.textContent = todaysWord.w;
    meaningEl.textContent = todaysWord.m;
    yesterdayEl.textContent = `Yesterday: ${yesterdaysWord.w} — ${yesterdaysWord.m}`;

    let saved = loadSaved();

    function isSavedToday(){
      return saved.some(x => x.w === todaysWord.w);
    }

    function renderSaved(){
      if (!saved.length){
        savedList.innerHTML = `<div style="opacity:.75; line-height:1.5;">No saved words yet. Tap 💜 on today’s word to save it here.</div>`;
        return;
      }

      savedList.innerHTML = saved
        .slice()
        .reverse()
        .map(item => `
          <div class="tile saved-item" style="width:100%;">
            <div class="ico">💜</div>
            <div style="flex:1;">
              <p class="t">${item.w}</p>
              <p class="m">${item.m}</p>
              <p class="m" style="opacity:.55; margin-top:6px;">Saved: ${new Date(item.savedAt).toLocaleDateString()}</p>
            </div>
          </div>
        `).join("");
    }

    function syncHeart(){
      saveBtn.setAttribute("aria-pressed", isSavedToday() ? "true" : "false");
    }

    saveBtn.addEventListener("click", ()=>{
      if (isSavedToday()){
        saved = saved.filter(x => x.w !== todaysWord.w);
      } else {
        saved.push({ ...todaysWord, savedAt: new Date().toISOString() });
      }
      saveSaved(saved);
      syncHeart();
      renderSaved();
    });

    clearSaved.addEventListener("click", ()=>{
      saved = [];
      saveSaved(saved);
      syncHeart();
      renderSaved();
    });

    syncHeart();
    renderSaved();
  </script>
</body>
</html>
