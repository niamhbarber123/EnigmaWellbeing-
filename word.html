<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daily word • Enigma</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#c8baff">
  <link rel="apple-touch-icon" href="icon.png">
</head>

<body>
  <div class="watermark" aria-hidden="true"></div>

  <main class="wrap">
    <div class="topbar">
      <a class="back" href="index.html" data-back>← Back</a>
      <button class="moon" data-theme-toggle aria-label="Night mode">🌙</button>
    </div>

    <h1 class="page-title">Daily word</h1>
    <p class="page-sub">A small focus for today.</p>

    <section class="card">
      <div class="quote-tile">
        <div class="quote-meta" id="todayDate"></div>
        <div class="quote-text" style="font-size:22px;" id="todayWord"></div>
        <div class="quote-meta" id="todayMeaning"></div>
      </div>

      <hr class="sep">

      <div class="quote-tile">
        <div class="quote-meta" id="yDate"></div>
        <div class="quote-text" style="font-size:18px;" id="yWord"></div>
        <div class="quote-meta" id="yMeaning"></div>
      </div>
    </section>
  </main>

  <script type="module">
    import { applySavedTheme, wireThemeButton, wireBackButton, registerServiceWorker } from "./app.js";
    applySavedTheme(); wireThemeButton(); wireBackButton(); registerServiceWorker();

    const words = [
      { w:"Gentle", m:"Soft, kind, not forced." },
      { w:"Steady", m:"Stable and grounded." },
      { w:"Release", m:"Let tension soften." },
      { w:"Pause", m:"A moment before the next step." },
      { w:"Enough", m:"You don’t have to earn rest." },
      { w:"Anchor", m:"Something that brings you back." },
      { w:"Breathe", m:"Slow in, slower out." },
      { w:"Patience", m:"Allow time to unfold." },
      { w:"Compassion", m:"Kindness toward yourself." },
      { w:"Balance", m:"Not too much, not too little." },
      { w:"Presence", m:"Here, not ahead." },
      { w:"Trust", m:"Belief in your own strength." },

      { w:"Reset", m:"Begin again, softly." },
      { w:"Clarity", m:"Seeing without overwhelm." },
      { w:"Grounded", m:"Connected to the present moment." },
      { w:"Stillness", m:"Calm without pressure." },
      { w:"Courage", m:"Brave in small ways." },
      { w:"Light", m:"Less heavy than before." },
      { w:"Hope", m:"Possibility ahead." },
      { w:"Grace", m:"Room for imperfection." },
      { w:"Restore", m:"Rebuild your energy." },
      { w:"Kindness", m:"Toward yourself first." },
      { w:"Flow", m:"Move without forcing." },
      { w:"Ease", m:"Let it be simpler." },
      { w:"Strength", m:"You have more than you think." },
      { w:"Support", m:"You don’t have to do it alone." },
      { w:"Soften", m:"Relax the tension." },
      { w:"Focus", m:"One small thing at a time." },
      { w:"Space", m:"Give yourself room." },
      { w:"Calm", m:"Quiet inside the noise." },
      { w:"Align", m:"Move in a way that feels right." },
      { w:"Reflect", m:"Notice without judgment." },
      { w:"Rebuild", m:"Piece by piece." },
      { w:"Intent", m:"Move with purpose." },
      { w:"Safe", m:"In this moment, you are okay." },
      { w:"Open", m:"Allow possibility in." },
      { w:"Slow", m:"There is no rush." },
      { w:"Release", m:"You can let that go." },
      { w:"Bloom", m:"Growth takes time." },
      { w:"Reconnect", m:"Come back to yourself." },
      { w:"Stability", m:"Solid ground beneath you." },
      { w:"Warmth", m:"Gentle comfort." },
      { w:"Acceptance", m:"It is what it is — and that’s okay." },
      { w:"Restore", m:"Energy can return." },
      { w:"Renew", m:"Fresh start energy." },
      { w:"Listen", m:"To yourself first." },
      { w:"Belong", m:"You are not alone." },
      { w:"Patience", m:"Growth isn’t instant." },
      { w:"Exhale", m:"Let your shoulders drop." },
      { w:"Caring", m:"Be on your own side." },
      { w:"Progress", m:"Small movement still counts." },
      { w:"Shift", m:"Change one small thing." },
      { w:"Heal", m:"Not perfect — just healing." },
      { w:"Create", m:"Make space for something new." },
      { w:"Stabilise", m:"Bring yourself back to centre." },
      { w:"Quiet", m:"Lower the noise." },
      { w:"Allow", m:"You don’t need to fight this." },
      { w:"Gratitude", m:"Notice what is steady." },
      { w:"Strengthen", m:"Build slowly." },
      { w:"Rooted", m:"Grounded and steady." }
    ];

    function dayIndex(d){
      const x = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()) / 86400000;
      return Math.abs(Math.floor(x)) % words.length;
    }

    const now = new Date();
    const y = new Date(now);
    y.setDate(now.getDate() - 1);

    const wToday = words[dayIndex(now)];
    const wY = words[dayIndex(y)];

    document.getElementById("todayDate").textContent = `Today • ${now.toLocaleDateString()}`;
    document.getElementById("todayWord").textContent = wToday.w;
    document.getElementById("todayMeaning").textContent = wToday.m;

    document.getElementById("yDate").textContent = `Yesterday • ${y.toLocaleDateString()}`;
    document.getElementById("yWord").textContent = wY.w;
    document.getElementById("yMeaning").textContent = wY.m;
  </script>
</body>
</html>
