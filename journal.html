<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Journal • Enigma</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#c8baff">
  <link rel="apple-touch-icon" href="icon.png">
</head>

<body>
  <div class="watermark" aria-hidden="true"></div>

  <main class="wrap">
    <div class="topbar">
      <a class="back" href="index.html" data-back>← Back</a>
      <button class="moon" data-theme-toggle aria-label="Night mode">🌙</button>
    </div>

    <h1 class="page-title">Journal</h1>
    <p class="page-sub">Write anything. No pressure.</p>

    <section class="card">
      <label style="font-weight:900;opacity:.7;font-size:12px;">New entry</label>
      <textarea id="entry" placeholder="What’s on your mind?"></textarea>

      <div style="height:10px;"></div>

      <div class="btn-row">
        <button class="btn primary" id="saveBtn" type="button">Save</button>
        <button class="btn" id="clearBtn" type="button">Clear</button>
      </div>

      <hr class="sep">

      <h2 style="margin:0 0 10px;">Recent entries</h2>
      <div class="full" id="list"></div>
      <p id="msg" style="margin:10px 0 0;color:var(--muted);font-weight:650;"></p>
    </section>
  </main>

  <script type="module">
    import { applySavedTheme, wireThemeButton, wireBackButton, registerServiceWorker } from "./app.js";
    applySavedTheme(); wireThemeButton(); wireBackButton(); registerServiceWorker();

    const KEY="enigma_journal_v2";
    const entryEl=document.getElementById("entry");
    const listEl=document.getElementById("list");
    const msg=document.getElementById("msg");

    function load(){ return JSON.parse(localStorage.getItem(KEY)||"[]"); }
    function saveAll(arr){ localStorage.setItem(KEY, JSON.stringify(arr)); }

    function escapeHtml(str){
      return String(str)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;");
    }

    function render(){
      const arr = load().slice().reverse();
      if (!arr.length){
        listEl.innerHTML = "";
        msg.textContent = "No entries yet.";
        return;
      }
      msg.textContent = "";
      listEl.innerHTML = arr.map(item=>`
        <div class="quote-tile" data-id="${item.id}">
          <div class="quote-text">${escapeHtml(item.text)}</div>
          <div class="quote-meta">${new Date(item.savedAt).toLocaleString()}</div>
          <button class="save-fab" type="button" title="Delete">🗑️</button>
        </div>
      `).join("");

      listEl.querySelectorAll(".quote-tile").forEach(tile=>{
        tile.querySelector(".save-fab").addEventListener("click", ()=>{
          const id = tile.dataset.id;
          const arr2 = load().filter(x=>x.id!==id);
          saveAll(arr2);
          render();
        });
      });
    }

    document.getElementById("saveBtn").addEventListener("click", ()=>{
      const txt = entryEl.value.trim();
      if (!txt){ msg.textContent="Write something first."; return; }
      const arr = load();
      const id = (crypto?.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random());
      arr.push({ id, text: txt, savedAt: new Date().toISOString() });
      saveAll(arr);
      entryEl.value="";
      render();
    });

    document.getElementById("clearBtn").addEventListener("click", ()=>{
      entryEl.value="";
      msg.textContent="";
    });

    render();
  </script>
</body>
</html>
