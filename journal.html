<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Journal • Enigma Wellbeing</title>

  <link rel="icon" href="icon.png" />
  <link rel="apple-touch-icon" href="icon.png" />
  <link rel="stylesheet" href="style.css?v=20260210final" />
</head>

<body class="page-wrap journal-page">
  <button id="themeFab" class="theme-toggle-top" type="button" aria-label="Toggle night mode">🌙</button>

  <header class="page-header">
    <button class="back-btn" type="button" onclick="enigmaHome()">←</button>
    <h1>Journal</h1>
    <p>A quiet space to write</p>
  </header>

  <main class="page" id="journalPage">
    <div class="card">
      <div class="section-title">New entry</div>
      <div class="gentle-text">What’s on your mind right now? No judgement — just words.</div>

      <textarea
        id="journalText"
        class="input"
        style="margin-top:12px; min-height:180px; resize:vertical;"
        placeholder="Write here…"
      ></textarea>

      <div class="tool-row" style="margin-top:12px;">
        <button id="journalSaveBtn" class="tool-btn primary" type="button">Save entry</button>
        <button id="journalViewBtn" class="tool-btn" type="button">View saved entries</button>
      </div>

      <div class="tool-row">
        <button id="journalDeleteAllBtn" class="tool-btn danger" type="button">Delete all entries</button>
      </div>

      <div class="gentle-text" id="journalStatus" style="margin-top:10px;">
        Saved entries stay on this device.
      </div>
    </div>

    <!-- Saved entries list -->
    <div class="card" id="journalSavedCard" style="display:none;">
      <div class="section-title">Saved entries</div>
      <div class="gentle-text" style="margin-top:-4px;">Tap an entry to expand/collapse.</div>

      <div id="journalSavedList" style="margin-top:12px;"></div>
    </div>
  </main>

  <nav class="bottom-nav">
    <a href="index.html"><div class="nav-ico">🏠</div><span>Home</span></a>
    <a href="breathe.html"><div class="nav-ico">🌬️</div><span>Breathe</span></a>
    <a class="active" href="journal.html"><div class="nav-ico">📖</div><span>Journal</span></a>
    <a href="quotes.html"><div class="nav-ico">💬</div><span>Quotes</span></a>
    <a href="yoga.html"><div class="nav-ico">🧘‍♀️</div><span>Yoga</span></a>
    <a href="sounds.html"><div class="nav-ico">🎵</div><span>Music</span></a>
    <a href="progress.html"><div class="nav-ico">📈</div><span>Progress</span></a>
  </nav>

  <script src="app.js?v=100002" defer></script>
</body>
</html>
