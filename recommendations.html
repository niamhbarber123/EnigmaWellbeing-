<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Enigma • Recommendations</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page">

    <!-- Tabs (optional) -->
    <div class="tabs">
      <button class="tab active" data-filter="ptsd">PTSD</button>
      <button class="tab" data-filter="stress">Stress</button>
      <button class="tab" data-filter="wellbeing">Wellbeing</button>
    </div>

    <!-- Header -->
    <header class="header">
      <button class="icon-btn" onclick="history.back()" aria-label="Back">←</button>

      <div class="title-wrap">
        <h1 class="h1">Recommendations</h1>
        <p class="subtitle">Tap ★ to favourite. “Open” goes to Goodreads.</p>
      </div>

      <button class="icon-btn" id="themeBtn" aria-label="Toggle theme">🌙</button>
    </header>

    <!-- Book list -->
    <section class="section" id="booksList">
      <!-- JS will inject book cards here -->
    </section>

  </main>

  <script src="recommendations.js"></script>
</body>
</html>
