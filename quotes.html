<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kind words • Enigma</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#c8baff">
  <link rel="apple-touch-icon" href="icon.png">
</head>

<body>
  <div class="watermark" aria-hidden="true"></div>

  <main class="wrap">
    <div class="topbar">
      <a class="back" href="index.html" data-back>← Back</a>
      <button class="moon" data-theme-toggle aria-label="Night mode">🌙</button>
    </div>

    <h1 class="page-title">Kind words</h1>
    <p class="page-sub">Double tap a quote to save or unsave.</p>

    <section class="card">
      <h2 style="margin:0 0 10px;">Quotes</h2>
      <div class="full" id="quotes"></div>

      <hr class="sep">

      <h2 style="margin:0 0 10px;">Saved</h2>
      <div class="full" id="saved"></div>
      <p id="msg" style="margin:10px 0 0;color:var(--muted);font-weight:650;"></p>
    </section>
  </main>

  <script type="module">
    import { applySavedTheme, wireThemeButton, wireBackButton, registerServiceWorker } from "./app.js";
    applySavedTheme(); wireThemeButton(); wireBackButton(); registerServiceWorker();

    const KEY="enigma_quotes_saved_v2";

    const QUOTES = [
      "You are allowed to take things one breath at a time.",
      "You don’t have to do everything today.",
      "Even small steps count.",
      "If all you did today was survive, that is enough.",
      "Your feelings are valid — and they can change.",
      "Rest is productive when you need it.",
      "You are not behind. You are healing.",
      "This moment will pass.",
      "You can be gentle with yourself and still move forward.",
      "It’s okay to ask for support.",
      "You deserve calm, even on difficult days.",
      "Breathe in safety. Breathe out pressure.",
      "You are doing better than you think.",
      "Slow is still progress.",
      "You can start again, softly.",
      "You don’t need permission to rest.",
      "One small thing at a time is enough.",
      "Your pace is valid.",
      "Be on your own side.",
      "You are not alone in this."
    ];

    const quotesEl=document.getElementById("quotes");
    const savedEl=document.getElementById("saved");
    const msg=document.getElementById("msg");

    function getSaved(){ return new Set(JSON.parse(localStorage.getItem(KEY)||"[]")); }
    function setSaved(set){ localStorage.setItem(KEY, JSON.stringify([...set])); }

    function tileHTML(text, id, isSaved, savedList=false){
      const mark = isSaved ? "✅" : "🔖";
      return `
        <div class="quote-tile ${isSaved ? "saved" : ""}" data-id="${id}">
          <div class="quote-text">${text}</div>
          <button class="save-fab" type="button" aria-label="Save">${mark}</button>
        </div>
      `;
    }

    function wireTiles(){
      document.querySelectorAll(".quote-tile").forEach(tile=>{
        const id = Number(tile.dataset.id);

        const toggle = ()=>{
          const saved = getSaved();
          if (saved.has(id)) saved.delete(id);
          else saved.add(id);
          setSaved(saved);
          render();
        };

        tile.querySelector(".save-fab").addEventListener("click", (e)=>{
          e.preventDefault();
          e.stopPropagation();
          toggle();
        });

        let lastTap = 0;
        tile.addEventListener("click", ()=>{
          const now = Date.now();
          if (now - lastTap < 350) toggle();
          lastTap = now;
        });
      });
    }

    function render(){
      const saved = getSaved();
      quotesEl.innerHTML = QUOTES.map((q,i)=>tileHTML(q,i,saved.has(i))).join("");
      const savedArr = [...saved];
      savedEl.innerHTML = savedArr.length
        ? savedArr.map(i=>tileHTML(QUOTES[i], i, true, true)).join("")
        : `<div class="quote-tile"><div class="quote-text">No saved quotes yet.</div></div>`;
      msg.textContent = "";
      wireTiles();
    }

    render();
  </script>
</body>
</html>
