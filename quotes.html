<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Quotes • Enigma Wellbeing</title>

  <link rel="icon" href="icon.png" />
  <link rel="apple-touch-icon" href="icon.png" />
  <link rel="stylesheet" href="./style.css?v=20260210fix3" />
</head>

<body class="page-wrap">
  <a class="back-btn" href="index.html" aria-label="Back to Home">←</a>
  <button id="themeFab" class="theme-toggle-top" type="button" aria-label="Toggle night mode">🌙</button>

  <header class="page-header">
    <h1>Quotes</h1>
    <p>Search and save words that ground you</p>
  </header>

  <main class="page">
    <section class="card">
      <div class="section-title">Find a quote</div>
      <input id="quoteQuery" class="input" placeholder="Search quotes or authors…" />

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px;">
        <button id="searchBtn" class="small-pill" type="button">Search</button>
        <button id="randomBtn" class="small-pill" type="button">Random</button>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px;">
        <button id="savedBtn" class="small-pill" type="button">💜 Saved (<span id="savedCount">0</span>)</button>
        <button id="deleteSavedBtn" class="small-pill" type="button" style="background:var(--dangerSoft);">Delete saved</button>
      </div>

      <div class="gentle-text" style="margin-top:12px;">Tip: only the 💜 button saves.</div>
    </section>

    <section id="quotesList" style="margin-top:14px;display:grid;gap:14px;"></section>
  </main>

  <nav class="bottom-nav">
    <a href="index.html"><div class="nav-ico">🏠</div><span>Home</span></a>

    <a href="yoga.html"><div class="nav-ico">🧘‍♀️</div><span>Yoga</span></a>
    <a href="sounds.html"><div class="nav-ico">🎵</div><span>Music</span></a>
    <a href="progress.html"><div class="nav-ico">📈</div><span>Progress</span></a>
  </nav>

  <script src="./app.js?v=20260210fix3" defer></script>
  <script src="./quotes.js?v=20260210fix3" defer></script>
</body>
</html>
