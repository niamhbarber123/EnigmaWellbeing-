  <header class="page-header">
    <h1>Quotes</h1>
    <p>Search and save words that ground you</p>
  </header>

  <main class="page">
    <section class="card">
      <h2 class="block-title">Find a quote</h2>

      <input
        id="quoteQuery"
        class="input"
        type="text"
        placeholder="Search quotes or authors…"
      />

      <div class="row">
        <button id="searchBtn" class="btn primary">Search</button>
        <button id="randomBtn" class="btn">Random</button>
      </div>

      <div class="row">
        <button class="btn">💜 Saved (<span id="savedCount">0</span>)</button>
        <button id="deleteSavedBtn" class="btn danger">Delete saved</button>
      </div>
<div id="quotesList" class="quote-list"></div>
      <p class="tip">Tip: only the 💜 button saves.</p>
    </section>

    <section id="quotesList" class="section"></section>
