<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Enigma • Quotes</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page">

    <!-- Header -->
    <header class="header">
      <button class="icon-btn" onclick="history.back()" aria-label="Back">←</button>

      <div class="title-wrap">
        <h1 class="h1">Quotes</h1>
        <p class="subtitle">Search and save motivational quotes</p>
      </div>

      <button class="icon-btn" id="themeBtn" aria-label="Toggle theme">🌙</button>
    </header>

    <!-- Search box card -->
    <section class="card">
      <h2 class="block-title">Find a quote</h2>

      <input
        id="quoteQuery"
        class="input"
        type="text"
        placeholder="Search quotes or authors… (e.g. calm, courage, Mandela)"
      />

      <div class="row">
        <button class="btn primary" id="searchBtn">Search</button>
        <button class="btn" id="randomBtn">Random</button>
      </div>

      <div class="row">
        <button class="btn" id="savedBtn">💜 Saved (<span id="savedCount">0</span>)</button>
        <button class="btn danger" id="deleteSavedBtn">Delete saved</button>
      </div>

      <p class="tip">Tip: only the 💜 button saves.</p>
    </section>

    <!-- Quote results list -->
    <section class="section" id="quotesList">
      <!-- JS will inject quote cards here -->
    </section>

  </main>

  <script src="quotes.js"></script>
</body>
</html>
