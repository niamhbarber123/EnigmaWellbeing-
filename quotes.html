<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Quotes • Enigma Wellbeing</title>

  <link rel="icon" href="icon.png" />
  <link rel="apple-touch-icon" href="icon.png" />
  <link rel="stylesheet" href="./style.css?v=20260210q1" />
</head>

<body class="page-wrap">
  <a class="back-btn" href="index.html" aria-label="Back to Home">←</a>
  <button id="themeFab" class="theme-toggle-top" type="button" aria-label="Toggle night mode">🌙</button>

  <header class="page-header">
    <h1>Quotes</h1>
    <p>Save the ones that calm you</p>
  </header>

  <main class="page">
    <!-- SEARCH / CONTROLS -->
    <section class="card">
      <div class="section-title">Find a quote</div>

      <input
        id="quoteQuery"
        class="input"
        type="text"
        inputmode="search"
        autocomplete="off"
        placeholder="Search by word or author…"
        style="margin-top:12px;"
      />

      <div class="row" style="margin-top:12px;">
        <button id="searchBtn" class="btn primary" type="button">Search</button>
        <button id="randomBtn" class="btn" type="button">Random</button>
      </div>

      <div class="row" style="margin-top:10px;">
        <button id="showSavedBtn" class="btn" type="button">Show saved</button>
        <button id="deleteSavedBtn" class="btn danger" type="button">Delete saved</button>
      </div>

      <div class="gentle-text" style="margin-top:10px;">
        Saved: <strong><span id="savedCount">0</span></strong>
      </div>
    </section>

    <!-- RESULTS -->
    <section class="card" style="margin-top:14px;">
      <div class="section-title" id="resultsTitle">Today’s picks</div>
      <div id="quotesList" style="margin-top:12px;"></div>
    </section>
  </main>

  <nav class="bottom-nav">
    <a href="index.html"><div class="nav-ico">🏠</div><span>Home</span></a>
    <a href="breathe.html"><div class="nav-ico">🌬️</div><span>Breathe</span></a>
    <a href="journal.html"><div class="nav-ico">📖</div><span>Journal</span></a>
    <a class="active" href="quotes.html"><div class="nav-ico">💬</div><span>Quotes</span></a>
    <a href="yoga.html"><div class="nav-ico">🧘‍♀️</div><span>Yoga</span></a>
    <a href="sounds.html"><div class="nav-ico">🎵</div><span>Music</span></a>
    <a href="progress.html"><div class="nav-ico">📈</div><span>Progress</span></a>
  </nav>

  <script src="./app.js?v=20260210q1" defer></script>
  <script src="./quotes.js?v=20260210q1" defer></script>
</body>
</html>
