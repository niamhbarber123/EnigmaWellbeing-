<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kind words • Enigma Wellbeing</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />

  <style>
    .tabs{
      display:flex;
      gap:10px;
      margin-bottom:12px;
    }
    .tab{
      flex:1;
      height:44px;
      border-radius:999px;
      border:1px solid var(--stroke);
      background: var(--card);
      box-shadow: var(--shadow2);
      cursor:pointer;
      font-weight:600;
    }
    .tab[aria-pressed="true"]{
      background: var(--accentTint);
      outline: 2px solid var(--accentRing);
      outline-offset: 2px;
    }

    .quotes-list{
      display:flex;
      flex-direction:column;
      gap:14px;
    }

    .quote-tile{
      position:relative;
      padding:18px 18px 44px;
      border-radius: 24px;
      border:1px solid var(--stroke);
      background: var(--card);
      box-shadow: var(--shadow2);
    }

    .quote-text{
      margin:0 0 10px;
      font-weight:500;
      line-height:1.6;
      opacity:.92;
    }

    .quote-author{
      margin:0;
      font-size:13px;
      font-weight:500;
      opacity:.65;
    }

    .save-btn{
      position:absolute;
      bottom:12px;
      right:14px;
      background:none;
      border:none;
      font-size:22px;
      cursor:pointer;
      opacity:.65;
      transition:.18s ease;
      line-height:1;
    }

    .save-btn.saved{
      opacity:1;
      transform:scale(1.12);
    }
  </style>
</head>

<body>
  <div class="watermark" aria-hidden="true"></div>

  <main class="wrap">
    <div class="topbar">
      <a class="back" href="index.html">←</a>
      <div style="width:44px;"></div>
    </div>

    <h1 class="page-title">Kind words</h1>
    <p class="page-sub">Save the ones that feel right.</p>

    <div class="tabs">
      <button class="tab" id="tabAll" aria-pressed="true" type="button">All</button>
      <button class="tab" id="tabSaved" aria-pressed="false" type="button">Saved</button>
    </div>

    <section class="card">
      <div class="quotes-list" id="quotesList"></div>
      <p class="small-note" id="emptyMsg" style="margin:0; display:none;">No saved quotes yet.</p>
    </section>
  </main>

  <script type="module">
    import { applySavedTheme, applySavedPreferences } from "./app.js";
    applySavedTheme();
    applySavedPreferences();
  </script>

  <script>
    const KEY = "enigma_saved_quotes_v2";

    const quotes = [
      { text:"You are allowed to take up space.", author:"Unknown" },
      { text:"Rest is productive.", author:"Unknown" },
      { text:"Small steps still count.", author:"Unknown" },
      { text:"You do not have to do everything today.", author:"Unknown" },
      { text:"You are doing better than you think.", author:"Unknown" },
      { text:"It’s okay to start again.", author:"Unknown" },
      { text:"Progress is not always loud.", author:"Unknown" },
      { text:"You deserve kindness, especially from yourself.", author:"Unknown" },

      { text:"You do not have to control your thoughts. You just have to stop letting them control you.", author:"Dan Millman" },
      { text:"Almost everything will work again if you unplug it for a few minutes, including you.", author:"Anne Lamott" },
      { text:"Feelings are just visitors. Let them come and go.", author:"Mooji" },
      { text:"No feeling is final.", author:"Rainer Maria Rilke" },
      { text:"There is hope, even when your brain tells you there isn’t.", author:"John Green" },
      { text:"You are allowed to be both a masterpiece and a work in progress at the same time.", author:"Sophia Bush" },
      { text:"Your present circumstances don’t determine where you can go; they merely determine where you start.", author:"Nido Qubein" },
      { text:"Healing takes time, and asking for help is a courageous step.", author:"Mariska Hargitay" },

      { text:"Be patient with yourself. Nothing in nature blooms all year.", author:"Unknown" },
      { text:"Slow down. You’re doing the best you can.", author:"Unknown" },
      { text:"You have survived 100% of your hardest days.", author:"Unknown" },
      { text:"Breathe. This moment will pass.", author:"Unknown" },
      { text:"You don’t have to have it all figured out to move forward.", author:"Roy T. Bennett" },
      { text:"Sometimes the bravest thing you can do is rest.", author:"Unknown" },
      { text:"You are not behind in life. There is no timetable.", author:"Unknown" },
      { text:"Let yourself be a beginner.", author:"Unknown" },
      { text:"The way you speak to yourself matters.", author:"Unknown" }
    ];

    const list = document.getElementById("quotesList");
    const emptyMsg = document.getElementById("emptyMsg");
    const tabAll = document.getElementById("tabAll");
    const tabSaved = document.getElementById("tabSaved");

    let view = "all"; // all | saved

    function makeId(q){
      return `${q.text}__${q.author}`;
    }
    function getSaved(){
      return JSON.parse(localStorage.getItem(KEY) || "[]");
    }
    function setSaved(arr){
      localStorage.setItem(KEY, JSON.stringify(arr));
    }
    function toggleSave(id){
      let saved = getSaved();
      if(saved.includes(id)) saved = saved.filter(x => x !== id);
      else saved.push(id);
      setSaved(saved);
      render();
    }
    function esc(s){
      return s.replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;");
    }

    function render(){
      const saved = getSaved();
      const data = (view === "saved")
        ? quotes.filter(q => saved.includes(makeId(q)))
        : quotes;

      emptyMsg.style.display = (view === "saved" && data.length === 0) ? "block" : "none";

      list.innerHTML = data.map(q=>{
        const id = makeId(q);
        const isSaved = saved.includes(id);
        return `
          <div class="quote-tile">
            <p class="quote-text">“${esc(q.text)}”</p>
            <p class="quote-author">— ${esc(q.author)}</p>
            <button class="save-btn ${isSaved ? "saved" : ""}" type="button" data-id="${esc(id)}">💜</button>
          </div>
        `;
      }).join("");

      list.querySelectorAll(".save-btn").forEach(btn=>{
        btn.addEventListener("click", ()=>{
          toggleSave(btn.getAttribute("data-id"));
        });
      });
    }

    tabAll.addEventListener("click", ()=>{
      view = "all";
      tabAll.setAttribute("aria-pressed","true");
      tabSaved.setAttribute("aria-pressed","false");
      render();
    });

    tabSaved.addEventListener("click", ()=>{
      view = "saved";
      tabAll.setAttribute("aria-pressed","false");
      tabSaved.setAttribute("aria-pressed","true");
      render();
    });

    render();
  </script>
</body>
</html>
