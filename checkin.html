<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Check in • Enigma</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#c8baff">
  <link rel="apple-touch-icon" href="icon.png">
</head>

<body>
  <div class="watermark" aria-hidden="true"></div>

  <main class="wrap">
    <div class="topbar">
      <a class="back" href="index.html" data-back>← Back</a>
      <button class="moon" data-theme-toggle aria-label="Night mode">🌙</button>
    </div>

    <h1 class="page-title">Check in</h1>
    <p class="page-sub">Pick what fits best. One is enough.</p>

    <section class="card">
      <details class="folder" open>
        <summary class="folder-title">🙂 Calm / Okay <span style="opacity:.5;">›</span></summary>
        <div class="folder-sub">Steady, grounded, managing.</div>
        <div class="folder-grid" id="grp-calm"></div>
      </details>

      <details class="folder">
        <summary class="folder-title">😟 Stress / Anxiety <span style="opacity:.5;">›</span></summary>
        <div class="folder-sub">Worried, tense, on edge.</div>
        <div class="folder-grid" id="grp-stress"></div>
      </details>

      <details class="folder">
        <summary class="folder-title">🌧️ Low / Heavy <span style="opacity:.5;">›</span></summary>
        <div class="folder-sub">Tired, flat, overwhelmed.</div>
        <div class="folder-grid" id="grp-low"></div>
      </details>

      <details class="folder">
        <summary class="folder-title">😠 Frustration <span style="opacity:.5;">›</span></summary>
        <div class="folder-sub">Irritable, stuck, annoyed.</div>
        <div class="folder-grid" id="grp-angry"></div>
      </details>

      <hr class="sep">

      <label style="font-weight:900;opacity:.7;font-size:12px;">Optional note</label>
      <textarea id="note" placeholder="One sentence is enough. (optional)"></textarea>

      <div style="height:10px;"></div>

      <div class="btn-row">
        <button class="btn primary" id="saveBtn" type="button">Save check in</button>
        <button class="btn" id="clearBtn" type="button">Clear</button>
      </div>

      <p style="margin:10px 0 0;color:var(--muted);font-weight:650;" id="msg"></p>
    </section>
  </main>

  <script type="module">
    import { applySavedTheme, wireThemeButton, wireBackButton, registerServiceWorker } from "./app.js";
    applySavedTheme(); wireThemeButton(); wireBackButton(); registerServiceWorker();

    const KEY = "enigma_checkins_v2";
    const msg = document.getElementById("msg");
    const noteEl = document.getElementById("note");

    const moods = {
      calm: [
        {k:"Calm", ico:"🙂"},
        {k:"Okay", ico:"😌"},
      ],
      stress: [
        {k:"Anxious", ico:"😟"},
        {k:"Stressed", ico:"😣"},
      ],
      low: [
        {k:"Low", ico:"🌧️"},
        {k:"Overwhelmed", ico:"🧠"},
      ],
      angry: [
        {k:"Frustrated", ico:"😤"},
        {k:"Angry", ico:"😠"},
      ]
    };

    let selected = null;

    function renderGroup(id, list){
      const el = document.getElementById(id);
      el.innerHTML = list.map(m => `
        <button class="mood-btn" type="button" data-mood="${m.k}" aria-pressed="${selected===m.k}">
          <span style="font-size:18px;">${m.ico}</span>
          <span>${m.k}</span>
        </button>
      `).join("");

      [...el.querySelectorAll("[data-mood]")].forEach(btn=>{
        btn.addEventListener("click", ()=>{
          selected = btn.dataset.mood;
          msg.textContent = "";
          refreshPressed();
        });
      });
    }

    function refreshPressed(){
      document.querySelectorAll("[data-mood]").forEach(b=>{
        b.setAttribute("aria-pressed", String(b.dataset.mood === selected));
      });
    }

    function loadLatest(){
      try{
        const arr = JSON.parse(localStorage.getItem(KEY) || "[]");
        if (!arr.length) return;
        const last = arr[arr.length-1];
        msg.textContent = `Last saved: ${new Date(last.savedAt).toLocaleString()} • ${last.mood}`;
      }catch{}
    }

    function save(){
      if (!selected){
        msg.textContent = "Choose a mood first.";
        return;
      }
      const entry = {
        mood: selected,
        note: noteEl.value.trim(),
        savedAt: new Date().toISOString()
      };
      const arr = JSON.parse(localStorage.getItem(KEY) || "[]");
      arr.push(entry);
      localStorage.setItem(KEY, JSON.stringify(arr));
      msg.textContent = `Saved. (${new Date(entry.savedAt).toLocaleString()})`;

      noteEl.value = "";
      selected = null;
      refreshPressed();
    }

    function clear(){
      noteEl.value = "";
      selected = null;
      msg.textContent = "";
      refreshPressed();
    }

    renderGroup("grp-calm", moods.calm);
    renderGroup("grp-stress", moods.stress);
    renderGroup("grp-low", moods.low);
    renderGroup("grp-angry", moods.angry);
    loadLatest();

    document.getElementById("saveBtn").addEventListener("click", save);
    document.getElementById("clearBtn").addEventListener("click", clear);
  </script>
</body>
</html>
