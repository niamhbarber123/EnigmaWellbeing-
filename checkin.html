<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Check in • Enigma Wellbeing</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />

  <style>
    /* Page-only: folders that match your tile/card style */
    details.folder{
      border:1px solid var(--stroke);
      background: var(--card);
      box-shadow: var(--shadow2);
      border-radius: 22px;
      padding: 10px 12px;
      margin-bottom: 12px;
    }

    details.folder summary{
      list-style:none;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding: 8px 6px;
      font-weight: 600;
    }

    details.folder summary::-webkit-details-marker{ display:none; }

    .folder-left{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:0;
    }

    .folder-ico{
      width:38px;
      height:38px;
      border-radius: 16px;
      border:1px solid var(--stroke);
      background: rgba(255,255,255,.62);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:18px;
      flex-shrink:0;
    }
    body.dark .folder-ico{ background: rgba(255,255,255,.10); }

    .folder-title{
      font-size:14px;
      font-weight: 600;
      margin:0;
    }
    .folder-sub{
      font-size:12.5px;
      font-weight:500;
      opacity:.72;
      margin:2px 0 0;
      line-height:1.35;
    }

    .chev{
      opacity:.55;
      font-weight:700;
      font-size:20px;
    }

    .mood-grid{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:10px;
      margin: 10px 0 4px;
    }

    .mood-btn{
      border:1px solid var(--stroke);
      background: rgba(255,255,255,.55);
      border-radius: 18px;
      padding: 12px;
      box-shadow: var(--shadow2);
      cursor:pointer;
      text-align:left;
      display:flex;
      align-items:center;
      gap:10px;
      min-height:56px;
      font-weight:600;
    }
    body.dark .mood-btn{ background: rgba(255,255,255,.08); }

    .mood-btn[aria-pressed="true"]{
      outline: 2px solid rgba(200,186,255,.85);
      outline-offset: 2px;
      background: rgba(200,186,255,.18);
    }

    .mood-emoji{
      width:34px;
      height:34px;
      border-radius: 14px;
      border:1px solid var(--stroke);
      background: rgba(255,255,255,.62);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:16px;
      flex-shrink:0;
    }
    body.dark .mood-emoji{ background: rgba(255,255,255,.10); }

    .mood-name{
      font-size:13.5px;
      margin:0;
      font-weight:600;
    }
    .mood-hint{
      font-size:12px;
      margin:2px 0 0;
      opacity:.70;
      font-weight:500;
    }

    .note-label{
      font-weight:600;
      font-size:12px;
      opacity:.75;
      display:block;
      margin: 10px 0 6px;
    }

    #savedMsg{
      margin: 10px 0 0;
      font-weight:500;
      opacity:.72;
      line-height:1.4;
    }
  </style>
</head>

<body>
  <div class="watermark" aria-hidden="true"></div>

  <main class="wrap">
    <div class="topbar">
      <a class="back" href="index.html">←</a>
      <button class="moon" data-theme-toggle aria-label="Night mode">🌙</button>
    </div>

    <h1 class="page-title">Check in</h1>
    <p class="page-sub">How are you feeling right now? Choose what fits best.</p>

    <section class="card">

      <!-- FOLDERS -->
      <details class="folder" open>
        <summary>
          <div class="folder-left">
            <div class="folder-ico">🌿</div>
            <div>
              <p class="folder-title">Calm / steady</p>
              <p class="folder-sub">Settled, okay, or gently positive.</p>
            </div>
          </div>
          <div class="chev">›</div>
        </summary>

        <div class="mood-grid" data-group="calm"></div>
      </details>

      <details class="folder">
        <summary>
          <div class="folder-left">
            <div class="folder-ico">🌧️</div>
            <div>
              <p class="folder-title">Low / heavy</p>
              <p class="folder-sub">Tired, flat, or a bit down.</p>
            </div>
          </div>
          <div class="chev">›</div>
        </summary>

        <div class="mood-grid" data-group="low"></div>
      </details>

      <details class="folder">
        <summary>
          <div class="folder-left">
            <div class="folder-ico">⚠️</div>
            <div>
              <p class="folder-title">Stressed / anxious</p>
              <p class="folder-sub">Worried, tense, overwhelmed.</p>
            </div>
          </div>
          <div class="chev">›</div>
        </summary>

        <div class="mood-grid" data-group="anx"></div>
      </details>

      <details class="folder">
        <summary>
          <div class="folder-left">
            <div class="folder-ico">🔥</div>
            <div>
              <p class="folder-title">Irritated / frustrated</p>
              <p class="folder-sub">Annoyed, stuck, or on edge.</p>
            </div>
          </div>
          <div class="chev">›</div>
        </summary>

        <div class="mood-grid" data-group="ang"></div>
      </details>

      <hr class="sep" />

      <label class="note-label" for="note">Optional note</label>
      <textarea id="note" placeholder="One sentence is enough. (optional)"></textarea>

      <div style="height:10px;"></div>

      <div class="btn-row">
        <button class="btn primary" id="saveBtn" type="button">Save check in</button>
        <button class="btn" id="clearBtn" type="button">Clear</button>
      </div>

      <p class="small-note" id="savedMsg"></p>
    </section>
  </main>

  <script type="module">
    import { applySavedTheme, wireThemeButton } from "./app.js";
    applySavedTheme();
    wireThemeButton();
  </script>

  <script>
    const KEY = "enigma_checkins_v2";

    const moodGroups = {
      calm: [
        { key:"Calm",    ico:"🙂", sub:"Steady and settled" },
        { key:"Okay",    ico:"😌", sub:"Managing" }
      ],
      low: [
        { key:"Low",     ico:"🌧️", sub:"Heavy or tired" },
        { key:"Sad",     ico:"😔", sub:"A bit down" }
      ],
      anx: [
        { key:"Anxious", ico:"😟", sub:"Worried, tense" },
        { key:"Overwhelmed", ico:"🧠", sub:"Too much at once" }
      ],
      ang: [
        { key:"Frustrated", ico:"😤", sub:"Stuck or annoyed" },
        { key:"On edge",    ico:"⚠️", sub:"Irritable / jumpy" }
      ]
    };

    const noteEl = document.getElementById("note");
    const saveBtn = document.getElementById("saveBtn");
    const clearBtn = document.getElementById("clearBtn");
    const msg = document.getElementById("savedMsg");

    let selected = null;

    function renderGroup(groupKey){
      const grid = document.querySelector(`.mood-grid[data-group="${groupKey}"]`);
      const list = moodGroups[groupKey];

      grid.innerHTML = list.map(m => `
        <button class="mood-btn" type="button"
          data-mood="${m.key}"
          aria-pressed="${selected === m.key ? "true" : "false"}">
          <div class="mood-emoji">${m.ico}</div>
          <div style="min-width:0;">
            <p class="mood-name">${m.key}</p>
            <p class="mood-hint">${m.sub}</p>
          </div>
        </button>
      `).join("");

      grid.querySelectorAll("[data-mood]").forEach(btn=>{
        btn.addEventListener("click", ()=>{
          selected = btn.dataset.mood;
          msg.textContent = "";
          renderAll();
        });
      });
    }

    function renderAll(){
      renderGroup("calm");
      renderGroup("low");
      renderGroup("anx");
      renderGroup("ang");
    }

    function loadLatest(){
      try{
        const arr = JSON.parse(localStorage.getItem(KEY) || "[]");
        if(!arr.length) return;
        const last = arr[arr.length-1];
        msg.textContent = `Last saved: ${new Date(last.savedAt).toLocaleString()} • ${last.mood}`;
      }catch{}
    }

    saveBtn.addEventListener("click", ()=>{
      if(!selected){
        msg.textContent = "Choose a mood first.";
        return;
      }
      const entry = {
        mood: selected,
        note: noteEl.value.trim(),
        savedAt: new Date().toISOString()
      };
      const arr = JSON.parse(localStorage.getItem(KEY) || "[]");
      arr.push(entry);
      localStorage.setItem(KEY, JSON.stringify(arr));

      msg.textContent = `Saved. (${new Date(entry.savedAt).toLocaleString()})`;
      noteEl.value = "";
      selected = null;
      renderAll();
    });

    clearBtn.addEventListener("click", ()=>{
      noteEl.value = "";
      selected = null;
      msg.textContent = "";
      renderAll();
    });

    renderAll();
    loadLatest();
  </script>
</body>
</html>
