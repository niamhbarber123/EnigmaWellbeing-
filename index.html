<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Enigma Wellbeing</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <!-- Watermark behind everything -->
  <div class="bg-watermark" aria-hidden="true"></div>

  <main class="wrap">

    <!-- Header -->
    <header class="top">
      <div class="top-spacer"></div>

      <div class="brand">
        <h1>Enigma Wellbeing</h1>
        <p>Your calm space</p>
      </div>

      <button class="moon-btn" data-theme-toggle aria-label="Night mode">🌙</button>
    </header>

    <!-- RIGHT NOW -->
    <section class="section">
      <h2 class="section-title">Right now</h2>

      <a class="wide-tile wide-tile--cool" href="breathe.html">
        <span class="wide-ico">🫧</span>
        <span class="wide-label">Breathe now</span>
        <span class="chev">›</span>
      </a>

      <a class="wide-tile wide-tile--warm" href="overwhelmed.html">
        <span class="wide-ico">🫶</span>
        <span class="wide-label">I need calm</span>
        <span class="chev">›</span>
      </a>
    </section>

    <!-- TODAY -->
    <section class="section">
      <h2 class="section-title">Today</h2>

      <div class="grid">
        <a class="tile" href="checkin.html">
          <span class="tile-ico">📝</span>
          <span class="tile-label">Check in</span>
          <span class="chev small">›</span>
        </a>

        <a class="tile" href="journal.html">
          <span class="tile-ico">📖</span>
          <span class="tile-label">Journal</span>
          <span class="chev small">›</span>
        </a>

        <a class="tile" href="word.html">
          <span class="tile-ico">✨</span>
          <span class="tile-label">Daily word</span>
          <span class="chev small">›</span>
        </a>

        <a class="tile" href="quotes.html">
          <span class="tile-ico">💬</span>
          <span class="tile-label">Kind words</span>
          <span class="chev small">›</span>
        </a>
      </div>
    </section>

    <!-- EXPLORE -->
    <section class="section">
      <h2 class="section-title">Explore</h2>

      <div class="grid">
        <a class="tile" href="yoga.html">
          <span class="tile-ico">🧘</span>
          <span class="tile-label">Move gently</span>
          <span class="chev small">›</span>
        </a>

        <a class="tile" href="music.html">
          <span class="tile-ico">🎵</span>
          <span class="tile-label">Listen</span>
          <span class="chev small">›</span>
        </a>

        <a class="tile" href="books.html">
          <span class="tile-ico">📚</span>
          <span class="tile-label">Read</span>
          <span class="chev small">›</span>
        </a>

        <a class="tile" href="distraction.html">
          <span class="tile-ico">🧩</span>
          <span class="tile-label">Take a break</span>
          <span class="chev small">›</span>
        </a>
      </div>
    </section>

    <!-- YOUR SPACE -->
    <section class="section">
      <h2 class="section-title">Your space</h2>

      <div class="your-space">
        <a class="pill" href="progress.html">📊 <span>Progress</span></a>
        <a class="pill" href="resources.html">🧠 <span>Resources</span></a>
        <a class="pill" href="settings.html">⚙️ <span>Settings</span></a>
      </div>

      <a class="support" href="help.html">
        <span class="sos">SOS</span>
        <span class="support-text">Get support now</span>
        <span class="chev">›</span>
      </a>
    </section>

  </main>

  <script type="module">
    import { applySavedTheme, wireThemeButton } from "./app.js";
    applySavedTheme();
    wireThemeButton();
  </script>
</body>
</html>
