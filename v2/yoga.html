<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Move gently • Enigma Wellbeing</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="wrap">
    <div class="header">
      <a class="back-btn" href="index.html" data-back>← Back</a>
      <div class="header-center"></div>
      <button class="icon-btn" data-theme-toggle aria-label="Night mode">🌙</button>
    </div>

    <h1 class="page-title">Move gently</h1>
    <p class="page-subtitle">Short, gentle movement sessions. Tap a tile to open.</p>

    <section class="section-panel">
      <div class="grid">
        <a class="tile" href="https://www.youtube.com/results?search_query=10+minute+gentle+yoga" target="_blank" rel="noopener">
          <div class="tile-ico">🧘</div>
          <div><p class="tile-title">10 min gentle yoga</p><p class="tile-sub">Easy flow</p></div>
        </a>

        <a class="tile" href="https://www.youtube.com/results?search_query=neck+shoulder+stretch+routine" target="_blank" rel="noopener">
          <div class="tile-ico">💆</div>
          <div><p class="tile-title">Neck & shoulders</p><p class="tile-sub">Release tension</p></div>
        </a>

        <a class="tile" href="https://www.youtube.com/results?search_query=bedtime+stretch+routine" target="_blank" rel="noopener">
          <div class="tile-ico">🛏️</div>
          <div><p class="tile-title">Bedtime stretch</p><p class="tile-sub">Wind down</p></div>
        </a>

        <a class="tile" href="https://www.youtube.com/results?search_query=beginner+yoga+breathing" target="_blank" rel="noopener">
          <div class="tile-ico">🌬️</div>
          <div><p class="tile-title">Breath + movement</p><p class="tile-sub">Slow & steady</p></div>
        </a>
      </div>
    </section>
  </main>

  <script type="module">
    import { applySavedTheme, wireThemeButton, wireBackButton } from "./app.js";
    applySavedTheme(); wireThemeButton(); wireBackButton();
  </script>
</body>
</html>
