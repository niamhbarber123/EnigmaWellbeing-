<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Settings • Enigma Wellbeing</title>
  <link rel="icon" href="icon.png" />
  <link rel="apple-touch-icon" href="icon.png" />
  <link rel="stylesheet" href="style.css?v=20260211v2a" />
</head>

<body class="page-wrap">
  <a class="back-btn" href="index.html" aria-label="Back to Home">←</a>
  <button id="themeFab" class="theme-toggle-top" type="button" aria-label="Toggle night mode">🌙</button>

  <header class="page-header">
    <h1>Settings</h1>
    <p>Make Enigma feel right for you</p>
  </header>

  <main class="page">
    <section class="card">
      <div class="section-title">Breathing pace</div>
      <div class="gentle-text" style="margin-top:6px;">Choose what feels comfortable.</div>

      <div class="row" style="margin-top:12px;">
        <button class="btn primary" type="button">🐢 Slow</button>
        <button class="btn primary" type="button">😌 Standard</button>
        <button class="btn primary" type="button">⚡ Fast</button>
      </div>

      <div class="gentle-text" style="margin-top:10px;">Standard pace selected.</div>
    </section>

    <section class="card">
      <div class="section-title">Reduce motion</div>
      <div class="gentle-text" style="margin-top:6px;">If animations feel too much.</div>

      <label class="gentle-text" style="display:flex; gap:10px; align-items:center; margin-top:12px; font-weight:800;">
        <input type="checkbox" />
        Reduce animation
      </label>

      <div class="gentle-text" style="margin-top:10px;">This affects Overwhelmed mode.</div>
    </section>
  </main>

  <script src="app.js?v=20260211v2a" defer></script>
</body>
</html>
