<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings • Enigma</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body class="page-wrap">
  <header class="app-header">
    <button class="back-btn">←</button>
    <button class="theme-toggle">🌙</button>
    <h1>Settings</h1>
    <p>Make Enigma feel right for you</p>
  </header>

  <main>
    <section class="card">
      <h2 class="section-title">Breathing pace</h2>
      <div class="pill-row">
        <button class="pill" data-pace="slow">🐢 Slow</button>
        <button class="pill active" data-pace="standard">🙂 Standard</button>
        <button class="pill" data-pace="fast">⚡ Fast</button>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
  <script src="settings.js"></script>
</body>
</html>
