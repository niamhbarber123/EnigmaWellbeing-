<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Quotes • Enigma Wellbeing</title>

  <link rel="icon" href="icon.png" />
  <link rel="apple-touch-icon" href="icon.png" />

  <!-- v2 shared styles -->
  <link rel="stylesheet" href="style.css?v=20260211v2a" />
</head>

<body class="page-wrap">
  <!-- Back + Night mode (consistent on all v2 pages) -->
  <a class="back-btn" href="index.html" aria-label="Back to Home">←</a>
  <button id="themeFab" class="theme-toggle-top" type="button" aria-label="Toggle night mode">🌙</button>

  <header class="page-header">
    <h1>Quotes</h1>
    <p>Search and save words that ground you</p>
  </header>

  <main class="page">
    <section class="card">
      <div class="section-title">Daily quote</div>
      <div class="gentle-text" style="margin-top:6px;">A gentle one for today.</div>

      <!-- quotes.js fills this -->
      <div id="dailyQuote" class="inner-box" style="margin-top:12px;"></div>
    </section>

    <section class="card">
      <div class="section-title">Find a quote</div>

      <input
        id="quoteQuery"
        class="input"
        style="margin-top:12px;"
        placeholder="Search quotes or authors..."
        autocomplete="off"
      />

      <div class="row" style="margin-top:12px;">
        <button id="searchBtn" class="btn primary" type="button">Search</button>
        <button id="randomBtn" class="btn" type="button">Random</button>
      </div>

      <div class="row" style="margin-top:12px;">
        <button id="showSavedBtn" class="btn primary" type="button">
          💜 Saved (<span id="savedCount">0</span>)
        </button>
        <button id="deleteSavedBtn" class="btn danger" type="button">Delete saved</button>
      </div>

      <div class="gentle-text" style="margin-top:10px;">Tip: only the 💜 button saves.</div>
    </section>

    <!-- quotes.js fills this -->
    <div id="quotesList" style="margin-top:14px;"></div>
  </main>

  <!-- v2 shared theme script -->
  <script src="app.js?v=20260211v2a" defer></script>

  <!-- your quotes logic -->
  <script src="quotes.js?v=20260211v2a" defer></script>
</body>
</html>
