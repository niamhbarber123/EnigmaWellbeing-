<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Check in • Enigma Wellbeing</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body class="page-wrap">
  <a class="back-btn" href="index.html">←</a>
  <button class="theme-toggle-top" id="themeFab">🌙</button>

  <header class="page-header">
    <h1>Check in</h1>
    <p>How are you feeling right now?</p>
  </header>

  <main>
    <div class="card">
      <div style="display:grid;gap:12px;">
        <button class="pill">😆 Excited</button>
        <button class="pill">😁 Happy</button>
        <button class="pill">😊 Okay</button>
        <button class="pill">😔 Low</button>
        <button class="pill">😰 Anxious</button>
        <button class="pill">🤯 Overwhelmed</button>
        <button class="pill">😡 Angry</button>
      </div>

      <textarea
        placeholder="Anything you want to note?"
        rows="4"
        style="margin-top:16px;"
      ></textarea>

      <button class="pill" style="margin-top:16px;">
        Save check-in
      </button>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
