<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Check in • Enigma Wellbeing</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="wrap">
    <div class="header">
      <a class="back-btn" href="index.html" data-back>← Back</a>
      <div class="header-center"></div>
      <button class="icon-btn" data-theme-toggle aria-label="Night mode">🌙</button>
    </div>

    <h1 class="page-title">Check in</h1>
    <p class="page-subtitle">How are you feeling right now? Save a quick note for yourself.</p>

    <section class="section-panel">
      <div class="grid" id="moods"></div>

      <hr class="sep" />

      <label style="font-weight:900; opacity:.75;">Optional note</label>
      <textarea id="note" placeholder="One sentence is enough."></textarea>

      <div style="height:10px;"></div>
      <button class="btn" id="saveBtn">Save check in</button>
      <p class="small-note" id="savedMsg"></p>
    </section>
  </main>

  <script type="module">
    import { applySavedTheme, wireThemeButton, wireBackButton } from "./app.js";
    applySavedTheme(); wireThemeButton(); wireBackButton();

    const moods = [
      { key:"Calm", ico:"🙂", sub:"Steady, settled" },
      { key:"Okay", ico:"😌", sub:"Not perfect, but okay" },
      { key:"Low", ico:"🌧️", sub:"Heavy, tired, flat" },
      { key:"Anxious", ico:"🫧", sub:"Worried, tense" },
    ];

    const KEY = "enigma_checkins_v2";
    const moodsEl = document.getElementById("moods");
    const noteEl = document.getElementById("note");
    const saveBtn = document.getElementById("saveBtn");
    const msg = document.getElementById("savedMsg");

    let selected = null;

    function render(){
      moodsEl.innerHTML = moods.map(m => `
        <button class="tile" type="button" data-mood="${m.key}" style="cursor:pointer;">
          <div class="tile-ico">${m.ico}</div>
          <div>
            <p class="tile-title">${m.key}</p>
            <p class="tile-sub">${m.sub}</p>
          </div>
        </button>
      `).join("");

      [...moodsEl.querySelectorAll("[data-mood]")].forEach(btn=>{
        btn.addEventListener("click", ()=>{
          selected = btn.dataset.mood;
          [...moodsEl.querySelectorAll("[data-mood]")].forEach(b=>{
            b.style.outline = (b.dataset.mood === selected) ? "2px solid rgba(200,186,255,.9)" : "none";
            b.style.background = (b.dataset.mood === selected) ? "rgba(200,186,255,.18)" : "";
          });
          msg.textContent = "";
        });
      });
    }

    function loadLatest(){
      try{
        const arr = JSON.parse(localStorage.getItem(KEY) || "[]");
        if (!arr.length) return;
        const last = arr[arr.length-1];
        noteEl.value = last.note || "";
        msg.textContent = `Last saved: ${new Date(last.savedAt).toLocaleString()}`;
      }catch{}
    }

    saveBtn.addEventListener("click", ()=>{
      if (!selected){
        msg.textContent = "Choose a mood first.";
        return;
      }
      const entry = {
        mood: selected,
        note: noteEl.value.trim(),
        savedAt: new Date().toISOString()
      };
      const arr = JSON.parse(localStorage.getItem(KEY) || "[]");
      arr.push(entry);
      localStorage.setItem(KEY, JSON.stringify(arr));
      msg.textContent = `Saved. (${new Date(entry.savedAt).toLocaleString()})`;
    });

    render();
    loadLatest();
  </script>
</body>
</html>
