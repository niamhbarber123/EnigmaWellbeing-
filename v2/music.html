<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Music • Enigma Wellbeing</title>
<link rel="stylesheet" href="style.css">
</head>

<body>
<main class="wrap">

<div class="header">
  <a class="back-btn" href="index.html" data-back>← Back</a>
  <div class="header-center"></div>
  <button class="icon-btn" data-theme-toggle>🌙</button>
</div>

<h1 class="page-title">Listen</h1>
<p class="page-subtitle">Choose something gentle.</p>

<section class="section-panel">
<div class="grid">

<a class="tile" href="https://www.youtube.com/results?search_query=calm+instrumental+music" target="_blank">
  <div class="tile-ico">🎼</div>
  <div>
    <p class="tile-title">Calm Instrumental</p>
    <p class="tile-sub">Soft background music</p>
  </div>
</a>

<a class="tile" href="https://www.youtube.com/results?search_query=ocean+waves+sound" target="_blank">
  <div class="tile-ico">🌊</div>
  <div>
    <p class="tile-title">Ocean Waves</p>
    <p class="tile-sub">Natural calming sounds</p>
  </div>
</a>

<a class="tile" href="https://www.youtube.com/results?search_query=rain+sounds+sleep" target="_blank">
  <div class="tile-ico">🌧️</div>
  <div>
    <p class="tile-title">Rain Sounds</p>
    <p class="tile-sub">White noise for calm</p>
  </div>
</a>

<a class="tile" href="https://www.youtube.com/results?search_query=piano+relaxing+music" target="_blank">
  <div class="tile-ico">🎹</div>
  <div>
    <p class="tile-title">Relaxing Piano</p>
    <p class="tile-sub">Slow & peaceful</p>
  </div>
</a>

<a class="tile" href="https://www.youtube.com/results?search_query=guided+meditation+music" target="_blank">
  <div class="tile-ico">🧘</div>
  <div>
    <p class="tile-title">Meditation Music</p>
    <p class="tile-sub">Deep focus</p>
  </div>
</a>

<a class="tile" href="https://www.youtube.com/results?search_query=lofi+calm+music" target="_blank">
  <div class="tile-ico">🎧</div>
  <div>
    <p class="tile-title">Lo-Fi Calm</p>
    <p class="tile-sub">Gentle background focus</p>
  </div>
</a>

</div>
</section>

</main>

<script type="module">
import { applySavedTheme, wireThemeButton, wireBackButton } from "./app.js";
applySavedTheme();
wireThemeButton();
wireBackButton();
</script>

</body>
</html>
