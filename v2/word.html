<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Word • Enigma Wellbeing</title>
<link rel="stylesheet" href="style.css">

<style>
.word-card{
  text-align:center;
  padding:28px 20px;
  border-radius:22px;
  background:var(--panel);
  border:1px solid var(--stroke);
  box-shadow:var(--shadow);
  margin-bottom:18px;
  transition:all .3s ease;
}

.word-main{
  font-size:32px;
  font-weight:900;
  margin:0 0 8px;
}

.word-meaning{
  font-size:15px;
  color:var(--muted);
  font-weight:700;
  margin:0;
}

.small-card{
  border-radius:18px;
  background:rgba(255,255,255,.45);
  border:1px solid var(--stroke);
  padding:14px;
  margin-top:12px;
}

body.dark .small-card{
  background:rgba(255,255,255,.06);
}

.fade{
  animation:fadeIn .3s ease;
}

@keyframes fadeIn{
  from{opacity:0; transform:translateY(5px);}
  to{opacity:1; transform:translateY(0);}
}
</style>
</head>

<body>
<main class="wrap">

<div class="header">
  <a class="back-btn" href="index.html" data-back>← Back</a>
  <div class="header-center"></div>
  <button class="icon-btn" data-theme-toggle>🌙</button>
</div>

<h1 class="page-title">Daily Word</h1>
<p class="page-subtitle">A gentle focus for today.</p>

<section class="section-panel">

<div class="word-card fade" id="todayCard">
  <p class="word-main" id="todayWord">—</p>
  <p class="word-meaning" id="todayMeaning">—</p>
</div>

<div class="btn-row">
  <button class="btn" id="newBtn">New word</button>
  <button class="btn" id="saveBtn">Save</button>
</div>

<p class="small-note" id="saveStatus"></p>

<hr class="sep">

<h2>Yesterday</h2>
<div class="small-card">
  <p class="word-main" style="font-size:22px;" id="yesterdayWord">—</p>
  <p class="word-meaning" id="yesterdayMeaning">—</p>
</div>

</section>
</main>

<script type="module">
import { applySavedTheme, wireThemeButton, wireBackButton } from "./app.js";
applySavedTheme();
wireThemeButton();
wireBackButton();

/* === YOUR EXACT WORD LIST === */
const words = [
  { w:"Gentle", m:"Soft, kind, not forced." },
  { w:"Steady", m:"Stable and grounded." },
  { w:"Release", m:"Let tension soften." },
  { w:"Pause", m:"A moment before the next step." },
  { w:"Enough", m:"You don’t have to earn rest." },
  { w:"Anchor", m:"Something that brings you back." },
  { w:"Breathe", m:"Slow in, slower out." },
  { w:"Patience", m:"Allow time to unfold." },
  { w:"Compassion", m:"Kindness toward yourself." },
  { w:"Balance", m:"Not too much, not too little." },
  { w:"Presence", m:"Here, not ahead." },
  { w:"Trust", m:"Belief in your own strength." },
  { w:"Reset", m:"Begin again, softly." },
  { w:"Clarity", m:"Seeing without overwhelm." },
  { w:"Grounded", m:"Connected to the present moment." },
  { w:"Stillness", m:"Calm without pressure." },
  { w:"Courage", m:"Brave in small ways." },
  { w:"Light", m:"Less heavy than before." },
  { w:"Hope", m:"Possibility ahead." },
  { w:"Grace", m:"Room for imperfection." },
  { w:"Restore", m:"Rebuild your energy." },
  { w:"Kindness", m:"Toward yourself first." },
  { w:"Flow", m:"Move without forcing." },
  { w:"Ease", m:"Let it be simpler." },
  { w:"Strength", m:"You have more than you think." },
  { w:"Support", m:"You don’t have to do it alone." },
  { w:"Soften", m:"Relax the tension." },
  { w:"Focus", m:"One small thing at a time." },
  { w:"Space", m:"Give yourself room." },
  { w:"Calm", m:"Quiet inside the noise." },
  { w:"Align", m:"Move in a way that feels right." },
  { w:"Reflect", m:"Notice without judgment." },
  { w:"Rebuild", m:"Piece by piece." },
  { w:"Intent", m:"Move with purpose." },
  { w:"Safe", m:"In this moment, you are okay." },
  { w:"Open", m:"Allow possibility in." },
  { w:"Slow", m:"There is no rush." },
  { w:"Release", m:"You can let that go." },
  { w:"Bloom", m:"Growth takes time." },
  { w:"Reconnect", m:"Come back to yourself." },
  { w:"Stability", m:"Solid ground beneath you." },
  { w:"Warmth", m:"Gentle comfort." },
  { w:"Acceptance", m:"It is what it is — and that’s okay." },
  { w:"Restore", m:"Energy can return." },
  { w:"Renew", m:"Fresh start energy." },
  { w:"Listen", m:"To yourself first." },
  { w:"Belong", m:"You are not alone." },
  { w:"Patience", m:"Growth isn’t instant." },
  { w:"Exhale", m:"Let your shoulders drop." },
  { w:"Caring", m:"Be on your own side." },
  { w:"Progress", m:"Small movement still counts." },
  { w:"Shift", m:"Change one small thing." },
  { w:"Heal", m:"Not perfect — just healing." },
  { w:"Create", m:"Make space for something new." },
  { w:"Stabilise", m:"Bring yourself back to centre." },
  { w:"Quiet", m:"Lower the noise." },
  { w:"Allow", m:"You don’t need to fight this." },
  { w:"Gratitude", m:"Notice what is steady." },
  { w:"Strengthen", m:"Build slowly." },
  { w:"Rooted", m:"Grounded and steady." }
];

const STORAGE_KEY = "enigma_daily_words_v4";
const SAVED_KEY = "enigma_saved_words_v2";

function dateKey(offset=0){
  const d = new Date();
  d.setDate(d.getDate()+offset);
  return d.toISOString().split("T")[0];
}

function getData(){
  return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
}

function saveData(obj){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(obj));
}

function pickRandom(excludeWord){
  const filtered = words.filter(w => w.w !== excludeWord);
  return filtered[Math.floor(Math.random()*filtered.length)];
}

function loadWord(){
  const data = getData();
  const today = dateKey(0);
  const yesterday = dateKey(-1);

  if(!data[today]){
    const yesterdayWord = data[yesterday]?.w;
    data[today] = pickRandom(yesterdayWord);
    saveData(data);
  }

  const todayWord = data[today];
  const yesterdayWord = data[yesterday];

  document.getElementById("todayWord").textContent = todayWord.w;
  document.getElementById("todayMeaning").textContent = todayWord.m;

  if(yesterdayWord){
    document.getElementById("yesterdayWord").textContent = yesterdayWord.w;
    document.getElementById("yesterdayMeaning").textContent = yesterdayWord.m;
  } else {
    document.getElementById("yesterdayWord").textContent = "—";
    document.getElementById("yesterdayMeaning").textContent = "No word recorded.";
  }

  updateSaveButton();
}

function updateSaveButton(){
  const saved = JSON.parse(localStorage.getItem(SAVED_KEY) || "[]");
  const current = document.getElementById("todayWord").textContent;
  const btn = document.getElementById("saveBtn");

  btn.textContent = saved.includes(current) ? "Unsave" : "Save";
}

document.getElementById("newBtn").addEventListener("click", ()=>{
  const data = getData();
  const today = dateKey(0);
  const yesterdayWord = data[dateKey(-1)]?.w;
  data[today] = pickRandom(yesterdayWord);
  saveData(data);
  loadWord();
});

document.getElementById("saveBtn").addEventListener("click", ()=>{
  const saved = JSON.parse(localStorage.getItem(SAVED_KEY) || "[]");
  const current = document.getElementById("todayWord").textContent;

  if(saved.includes(current)){
    const updated = saved.filter(w => w !== current);
    localStorage.setItem(SAVED_KEY, JSON.stringify(updated));
  } else {
    saved.push(current);
    localStorage.setItem(SAVED_KEY, JSON.stringify(saved));
  }

  updateSaveButton();
});

loadWord();
</script>
</body>
</html>
