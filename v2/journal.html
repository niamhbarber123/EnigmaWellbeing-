<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Journal • Enigma Wellbeing</title>

  <link rel="icon" href="icon.png" />
  <link rel="apple-touch-icon" href="icon.png" />

  <link rel="stylesheet" href="style.css?v=20260210-final" />
</head>

<body class="page-wrap">
  <button class="back-btn" type="button" onclick="location.href='index.html'">←</button>
  <button id="themeFab" class="theme-toggle-top" type="button" aria-label="Toggle night mode">🌙</button>

  <header class="page-header">
    <h1>Journal</h1>
    <p>A quiet space to write</p>
  </header>

  <main class="page">
    <section class="card">
      <div class="section-title">New entry</div>
      <div class="gentle-text" style="margin-top:6px;">
        What’s on your mind right now? No judgement — just words.
      </div>

      <textarea id="entryText" rows="7" placeholder="Write here…" style="margin-top:12px;"></textarea>

      <div class="row" style="margin-top:12px;">
        <button id="saveEntry" class="btn primary" type="button">Save entry</button>
        <button id="viewEntries" class="btn" type="button">View saved</button>
      </div>

      <div class="row" style="margin-top:12px;">
        <button id="deleteEntries" class="btn danger" type="button">Delete all</button>
        <button id="closeEntries" class="btn" type="button">Hide list</button>
      </div>

      <div class="gentle-text" style="margin-top:12px;">Saved entries stay on this device.</div>
    </section>

    <section class="card" id="entriesWrap" style="display:none; margin-top:14px;">
      <div class="section-title">Saved entries</div>
      <div id="entriesList" style="display:grid;gap:12px;margin-top:12px;"></div>
    </section>
  </main>

  <nav class="bottom-nav">
    <a href="index.html"><div class="nav-ico">🏠</div><span>Home</span></a>

    <a href="sounds.html"><div class="nav-ico">🎵</div><span>Music</span></a>
    <a href="progress.html"><div class="nav-ico">📈</div><span>Progress</span></a>
  </nav>

  <script src="app.js?v=20260210-final" defer></script>
  <script src="journal.js?v=20260210-final" defer></script>
</body>
</html>
