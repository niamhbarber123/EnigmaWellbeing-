  <button id="themeFab" class="theme-toggle-top" type="button" aria-label="Toggle night mode">🌙</button>

  <header class="page-header">
    <h1>I’m overwhelmed</h1>
    <p>Let’s make this smaller</p>
  </header>

  <main class="page">
    <section class="card">
      <div class="gentle-text" style="line-height:1.5;">
        You don’t have to solve everything. Just do the next small step.
      </div>

      <div class="breathe-clock-top" style="margin-top:12px;">
        <span class="time-label">Time:</span>
        <span id="ovTime" class="time-value">01:00</span>
      </div>

      <div class="breathe-circle-wrap">
        <div id="ovCircle" class="breath-circle" aria-label="Breathing circle">
          <div id="ovPhase" class="breath-text">Ready</div>
        </div>
      </div>

      <div class="breathe-btn-3" style="margin-top:12px;">
        <button id="ovStart" class="small-pill" type="button">Start</button>
        <button id="ovStop" class="small-pill" type="button">Stop</button>
        <a class="small-pill completed-pill" href="help.html" style="display:flex;align-items:center;justify-content:center;">
          Help
        </a>
      </div>

      <details class="info-accordion" style="margin-top:12px;">
        <summary>One grounding prompt</summary>
        <div class="info-body" id="ovPrompt"></div>
      </details>

      <div class="safe-note" style="margin-top:12px;">You can stop at any time.</div>
    </section>
