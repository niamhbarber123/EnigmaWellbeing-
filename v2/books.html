<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Books • Enigma Wellbeing</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="wrap">
    <div class="header">
      <a class="back-btn" href="index.html" data-back>← Back</a>
      <div class="header-center"></div>
      <button class="icon-btn" data-theme-toggle aria-label="Night mode">🌙</button>
    </div>

    <h1 class="page-title">Books</h1>
    <p class="page-subtitle">A few gentle reads. (Tap a tile to open.)</p>

    <section class="section-panel">
      <div class="grid">
        <a class="tile" href="https://www.nhs.uk/mental-health/" target="_blank" rel="noopener">
          <div class="tile-ico">🧠</div>
          <div><p class="tile-title">NHS Mental Health</p><p class="tile-sub">Trusted support & guides</p></div>
        </a>

        <a class="tile" href="https://www.mind.org.uk/" target="_blank" rel="noopener">
          <div class="tile-ico">🤝</div>
          <div><p class="tile-title">Mind</p><p class="tile-sub">UK support & info</p></div>
        </a>

        <div class="tile">
          <div class="tile-ico">📘</div>
          <div><p class="tile-title">Add your own list</p><p class="tile-sub">Replace these tiles with your books</p></div>
        </div>

        <div class="tile">
          <div class="tile-ico">📗</div>
          <div><p class="tile-title">Reading habit</p><p class="tile-sub">One page is enough</p></div>
        </div>
      </div>
    </section>
  </main>

  <script type="module">
    import { applySavedTheme, wireThemeButton, wireBackButton } from "./app.js";
    applySavedTheme(); wireThemeButton(); wireBackButton();
  </script>
</body>
</html>
