<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Breathe • Enigma Wellbeing</title>

  <link rel="icon" href="../icon.png" />
  <link rel="apple-touch-icon" href="../icon.png" />
  <link rel="stylesheet" href="style.css?v=20260210-v2-allfix" />
</head>

<body class="page-wrap">
  <a class="back-btn" href="index.html" aria-label="Back">←</a>
  <button id="themeFab" class="theme-toggle-top" type="button" aria-label="Toggle night mode">🌙</button>

  <div class="page-shell">
    <header class="page-header">
      <h1>Breathe</h1>
      <p>60 seconds to reset</p>
    </header>

    <section class="section">
      <div class="section-title">Right now</div>

      <div class="card">
        <div class="gentle">Follow the rhythm. Tap Start.</div>

        <div class="breath-wrap">
          <div id="breathCircle" class="breath-circle">
            <div id="phaseText" class="breath-phase">Ready</div>
            <div id="timeText" class="breath-time">01:00</div>
          </div>
        </div>

        <div class="row" style="margin-top:14px;">
          <button id="startBtn" class="pill" type="button" style="flex:1;">Start</button>
          <button id="pauseBtn" class="pill" type="button" style="flex:1;">Pause</button>
          <button id="resetBtn" class="pill" type="button" style="flex:1;">Reset</button>
        </div>
      </div>
    </section>
  </div>

  <script src="app.js?v=20260210-v2-allfix" defer></script>
  <script src="breathe.js?v=20260210-v2-allfix" defer></script>
</body>
</html>
