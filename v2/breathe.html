<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Breathe • Enigma Wellbeing</title>

  <link rel="icon" href="icon.png" />
  <link rel="apple-touch-icon" href="icon.png" />
  <link rel="stylesheet" href="style.css?v=20260210-breathe-fix1" />
</head>

<body class="page-wrap breathe-page no-scroll">
  <!-- Back ALWAYS goes home -->
  <a class="back-btn" href="index.html" aria-label="Back to Home">←</a>

  <!-- Night mode (top-right on all pages) -->
  <button id="themeFab" class="theme-toggle-top" type="button" aria-label="Toggle night mode">🌙</button>

  <header class="page-header breathe-header-compact">
    <h1>Breathe</h1>
    <p>Follow the rhythm</p>
  </header>

  <main class="page">
    <div class="breathe-viewport">

      <!-- READY / ANIMATION CARD -->
      <section class="card breathe-ready-card">
        <div class="breathe-ready-title">Ready</div>
        <div class="breathe-ready-sub" style="margin-top:4px;">Choose settings, then tap Start.</div>

        <!-- Clock ABOVE the circle -->
        <div class="breathe-clock-top" style="margin-top:10px;">
          <span class="time-label">Time:</span>
          <span id="timeText" class="time-value">01:00</span>
        </div>

        <div class="breathe-circle-wrap">
          <div id="breathCircle" class="breath-circle" aria-label="Breathing animation"></div>
        </div>

        <!-- ✅ Phase label (Inhale / Hold / Exhale) -->
        <div class="breathe-status">
          <div id="phaseText" class="breath-phase">Ready</div>
        </div>
      </section>

      <!-- SESSION CARD -->
      <section class="card breathe-session-card">
        <div class="section-title">Session</div>
        <div class="gentle-text" style="margin-top:6px;">Timer counts down. Stopwatch counts up.</div>

        <!-- Two dropdowns side-by-side, equal width -->
        <div class="breathe-two-col" style="margin-top:14px;">
          <div class="form-row">
            <div class="form-label big-label">Mode</div>
            <select id="modeSelect" class="select big-select" aria-label="Mode">
              <option value="timer">Timer</option>
              <option value="stopwatch">Stopwatch</option>
            </select>
            <div class="mini-hint">Timer counts down.</div>
          </div>

          <div class="form-row" id="minutesField">
            <div class="form-label big-label">Timer length</div>
            <select id="minutesSelect" class="select big-select" aria-label="Timer length">
              <option value="1">1 minute</option>
              <option value="2">2 minutes</option>
              <option value="3">3 minutes</option>
              <option value="5">5 minutes</option>
              <option value="10">10 minutes</option>
            </select>
            <div class="mini-hint">Choose minutes.</div>
          </div>
        </div>

        <!-- Buttons in thirds -->
        <div class="breathe-btn-3" style="margin-top:16px;">
          <button id="startBtn" class="small-pill" type="button">Start</button>
          <button id="pauseBtn" class="small-pill" type="button">Pause</button>
          <button id="resetBtn" class="small-pill" type="button">Reset</button>
        </div>

        <!-- Completed pill -->
        <div style="margin-top:12px;">
          <span id="completedPill" class="small-pill completed-pill" style="display:none; gap:8px; align-items:center;">
            Completed ✅
          </span>
        </div>
      </section>

    </div>
  </main>

  <nav class="bottom-nav">
    <a href="index.html"><div class="nav-ico">🏠</div><span>Home</span></a>
    <a class="active" href="breathe.html"><div class="nav-ico">🌬️</div><span>Breathe</span></a>
    <a href="journal.html"><div class="nav-ico">📖</div><span>Journal</span></a>
    <a href="quotes.html"><div class="nav-ico">💬</div><span>Quotes</span></a>
    <a href="yoga.html"><div class="nav-ico">🧘‍♀️</div><span>Yoga</span></a>
    <a href="sounds.html"><div class="nav-ico">🎵</div><span>Music</span></a>
    <a href="progress.html"><div class="nav-ico">📈</div><span>Progress</span></a>
  </nav>

  <script src="app.js?v=20260210-breathe-fix1" defer></script>
  <script src="breathe.js?v=20260210-breathe-fix1" defer></script>
</body>
</html>
