<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Books • Enigma Wellbeing</title>
  <link rel="stylesheet" href="style.css">
</head>

<body class="page-wrap">
<button id="themeFab" class="theme-toggle-top">🌙</button>

<header class="page-header">
  <button class="back-btn" onclick="location.href='index.html'">←</button>
  <h1>Books</h1>
  <p>Sorted by topic</p>
</header>

<main class="page">

  <div class="card">
    <div class="section-title">Genres</div>
    <div class="chip-row">
      <button class="chip active" data-genre="all">All</button>
      <button class="chip" data-genre="anxiety">Anxiety</button>
      <button class="chip" data-genre="depression">Depression</button>
      <button class="chip" data-genre="bpd">BPD</button>
      <button class="chip" data-genre="trauma">Trauma</button>
    </div>
  </div>

  <div class="card">
    <div class="section-title">Recommended</div>
    <div id="bookList"></div>
  </div>

</main>

<script src="app.js"></script>
</body>
</html>
