<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Books • Enigma Wellbeing</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />

  <style>
    .list{ display:flex; flex-direction:column; gap:12px; }
    .tile{ width:100%; min-height:84px; align-items:flex-start; }
    .tile-sub{ margin-top:2px; font-size:13px; }
  </style>
</head>
<body>
  <div class="watermark" aria-hidden="true"></div>
  <main class="wrap">
    <div class="topbar">
      <a class="back" href="index.html">←</a>
      <div style="width:44px;"></div>
    </div>

    <h1 class="page-title">Books</h1>
    <p class="page-sub">Pick something gentle.</p>

    <section class="card">
      <div class="list">
        <a class="tile" href="https://www.google.com/search?q=The+Comfort+Book+Matt+Haig" target="_blank" rel="noopener">
          <div class="ico">🫶</div><div style="flex:1;">
            <div class="label small">The Comfort Book</div><div class="tile-sub">Matt Haig • soothing reflections</div>
          </div><div class="arrow small">›</div>
        </a>

        <a class="tile" href="https://www.google.com/search?q=The+Happiness+Trap+Russ+Harris" target="_blank" rel="noopener">
          <div class="ico">🧠</div><div style="flex:1;">
            <div class="label small">The Happiness Trap</div><div class="tile-sub">Russ Harris • ACT skills</div>
          </div><div class="arrow small">›</div>
        </a>

        <a class="tile" href="https://www.google.com/search?q=The+House+in+the+Cerulean+Sea+TJ+Klune" target="_blank" rel="noopener">
          <div class="ico">🏡</div><div style="flex:1;">
            <div class="label small">The House in the Cerulean Sea</div><div class="tile-sub">TJ Klune • cosy comfort read</div>
          </div><div class="arrow small">›</div>
        </a>

        <a class="tile" href="https://www.google.com/search?q=Atomic+Habits+James+Clear" target="_blank" rel="noopener">
          <div class="ico">⚡</div><div style="flex:1;">
            <div class="label small">Atomic Habits</div><div class="tile-sub">James Clear • small changes</div>
          </div><div class="arrow small">›</div>
        </a>
      </div>
    </section>
  </main>

  <script type="module">
    import { applySavedTheme, applySavedPreferences } from "./app.js";
    applySavedTheme(); applySavedPreferences();
  </script>
</body>
</html>
