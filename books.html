<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Books • Enigma</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#c8baff">
  <link rel="apple-touch-icon" href="icon.png">
</head>

<body>
  <div class="watermark" aria-hidden="true"></div>
  <main class="wrap">
    <div class="topbar">
      <a class="back" href="index.html" data-back>← Back</a>
      <button class="moon" data-theme-toggle aria-label="Night mode">🌙</button>
    </div>

    <h1 class="page-title">Read</h1>
    <p class="page-sub">Choose a genre.</p>

    <section class="card">
      <label style="font-weight:900;opacity:.7;font-size:12px;">Genre</label>
      <select id="genre"></select>

      <hr class="sep">

      <div class="full" id="list"></div>
    </section>
  </main>

  <script type="module">
    import { applySavedTheme, wireThemeButton, wireBackButton, registerServiceWorker } from "./app.js";
    applySavedTheme(); wireThemeButton(); wireBackButton(); registerServiceWorker();

    const books = {
      "Comfort reads":[
        "The House in the Cerulean Sea — TJ Klune",
        "Eleanor Oliphant Is Completely Fine — Gail Honeyman",
        "The Little Prince — Antoine de Saint-Exupéry",
        "A Man Called Ove — Fredrik Backman",
        "The Comfort Book — Matt Haig",
        "The Midnight Library — Matt Haig"
      ],
      "Romance":[
        "The Flatshare — Beth O’Leary",
        "Beach Read — Emily Henry",
        "Red, White & Royal Blue — Casey McQuiston",
        "Pride and Prejudice — Jane Austen",
        "People We Meet on Vacation — Emily Henry"
      ],
      "Thriller / Mystery":[
        "The Thursday Murder Club — Richard Osman",
        "Gone Girl — Gillian Flynn",
        "The Girl on the Train — Paula Hawkins",
        "The Silent Patient — Alex Michaelides",
        "Big Little Lies — Liane Moriarty"
      ],
      "Fantasy":[
        "Harry Potter and the Philosopher’s Stone — J.K. Rowling",
        "The Hobbit — J.R.R. Tolkien",
        "Mistborn — Brandon Sanderson",
        "A Darker Shade of Magic — V.E. Schwab",
        "The Name of the Wind — Patrick Rothfuss"
      ],
      "Non-fiction (mind & wellbeing)":[
        "Reasons to Stay Alive — Matt Haig",
        "The Body Keeps the Score — Bessel van der Kolk",
        "Atomic Habits — James Clear",
        "The Happiness Trap — Russ Harris",
        "Why We Sleep — Matthew Walker"
      ],
      "Short & easy":[
        "Of Mice and Men — John Steinbeck",
        "The Alchemist — Paulo Coelho",
        "The Outsiders — S.E. Hinton",
        "Coraline — Neil Gaiman"
      ]
    };

    const genreEl = document.getElementById("genre");
    const listEl = document.getElementById("list");
    const genres = Object.keys(books);

    genreEl.innerHTML = genres.map(g=>`<option value="${g}">${g}</option>`).join("");

    function render(){
      const g = genreEl.value;
      listEl.innerHTML = books[g].map((b)=>`
        <div class="quote-tile" data-title="${encodeURIComponent(b)}">
          <div class="quote-text">${b}</div>
          <div class="quote-meta">Tap to search</div>
        </div>
      `).join("");

      listEl.querySelectorAll(".quote-tile").forEach(tile=>{
        tile.addEventListener("click", ()=>{
          const q = tile.dataset.title;
          window.open(`https://www.google.com/search?q=${q}`, "_blank");
        });
      });
    }

    genreEl.addEventListener("change", render);
    render();
  </script>
</body>
</html>
