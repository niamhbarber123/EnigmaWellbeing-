<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Progress • Enigma</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#c8baff">
  <link rel="apple-touch-icon" href="icon.png">
</head>

<body>
  <div class="watermark" aria-hidden="true"></div>
  <main class="wrap">
    <div class="topbar">
      <a class="back" href="index.html" data-back>← Back</a>
      <button class="moon" data-theme-toggle aria-label="Night mode">🌙</button>
    </div>

    <h1 class="page-title">Progress</h1>
    <p class="page-sub">Your small steps add up.</p>

    <section class="card" id="stats"></section>
  </main>

  <script type="module">
    import { applySavedTheme, wireThemeButton, wireBackButton, registerServiceWorker } from "./app.js";
    applySavedTheme(); wireThemeButton(); wireBackButton(); registerServiceWorker();

    const checkins = JSON.parse(localStorage.getItem("enigma_checkins_v2") || "[]");
    const journal  = JSON.parse(localStorage.getItem("enigma_journal_v2") || "[]");
    const breathe  = JSON.parse(localStorage.getItem("enigma_breathe_logs_v2") || "[]");
    const savedQuotes = JSON.parse(localStorage.getItem("enigma_quotes_saved_v2") || "[]");

    function streakFrom(arr){
      const days = new Set(arr.map(x => (new Date(x.savedAt)).toDateString()));
      const today = new Date();
      let streak=0;
      for(;;){
        const d = new Date(today);
        d.setDate(today.getDate()-streak);
        if(days.has(d.toDateString())) streak++;
        else break;
      }
      return streak;
    }

    document.getElementById("stats").innerHTML = `
      <h2 style="margin:0 0 10px;">This app activity</h2>

      <div class="grid">
        <div class="tile"><div class="ico">📝</div><div class="label small">Check-ins<br><span style="opacity:.6;font-weight:800;">${checkins.length}</span></div></div>
        <div class="tile"><div class="ico">📖</div><div class="label small">Journal entries<br><span style="opacity:.6;font-weight:800;">${journal.length}</span></div></div>
        <div class="tile"><div class="ico">🫧</div><div class="label small">Breathing sessions<br><span style="opacity:.6;font-weight:800;">${breathe.length}</span></div></div>
        <div class="tile"><div class="ico">💬</div><div class="label small">Saved quotes<br><span style="opacity:.6;font-weight:800;">${savedQuotes.length}</span></div></div>
      </div>

      <hr class="sep">

      <div class="quote-tile">
        <div class="quote-text">Current check-in streak: ${streakFrom(checkins)} day(s)</div>
        <div class="quote-meta">A streak is just a reminder — missing a day is okay.</div>
      </div>

      <div style="height:10px;"></div>

      <div class="btn-row">
        <a class="btn primary" href="checkin.html" style="text-decoration:none;display:flex;align-items:center;justify-content:center;">Check in</a>
        <a class="btn" href="journal.html" style="text-decoration:none;display:flex;align-items:center;justify-content:center;">Journal</a>
      </div>
    `;
  </script>
</body>
</html>
