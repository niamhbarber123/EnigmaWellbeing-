<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Progress • Enigma Wellbeing</title>
<link rel="stylesheet" href="style.css">
</head>

<body>
<main class="wrap">

<div class="header">
  <a class="back-btn" href="index.html" data-back>← Back</a>
  <div class="header-center"></div>
  <button class="icon-btn" data-theme-toggle>🌙</button>
</div>

<h1 class="page-title">Progress</h1>
<p class="page-subtitle">Your small steps add up.</p>

<section class="section-panel">

<div class="grid">

<div class="tile">
  <div class="tile-ico">📊</div>
  <div>
    <p class="tile-title" id="checkinCount">0</p>
    <p class="tile-sub">Check-ins completed</p>
  </div>
</div>

<div class="tile">
  <div class="tile-ico">📖</div>
  <div>
    <p class="tile-title" id="journalWords">0</p>
    <p class="tile-sub">Journal words written</p>
  </div>
</div>

<div class="tile">
  <div class="tile-ico">❤️</div>
  <div>
    <p class="tile-title" id="savedQuotes">0</p>
    <p class="tile-sub">Saved quotes</p>
  </div>
</div>

<div class="tile">
  <div class="tile-ico">✨</div>
  <div>
    <p class="tile-title" id="savedWords">0</p>
    <p class="tile-sub">Saved daily words</p>
  </div>
</div>

</div>

<hr class="sep">

<h2>Mood Summary</h2>
<div id="moodSummary"></div>

<hr class="sep">

<button class="btn" id="clearDataBtn">Clear All Data</button>

</section>
</main>

<script type="module">
import { applySavedTheme, wireThemeButton, wireBackButton } from "./app.js";
applySavedTheme();
wireThemeButton();
wireBackButton();

function updateStats(){

  const checkins = JSON.parse(localStorage.getItem("enigma_checkins_v2") || "[]");
  document.getElementById("checkinCount").textContent = checkins.length;

  const journal = localStorage.getItem("enigma_journal_v2") || "";
  const wordCount = journal.trim().split(/\s+/).filter(Boolean).length;
  document.getElementById("journalWords").textContent = wordCount;

  const quotes = JSON.parse(localStorage.getItem("enigma_saved_quotes_v2") || "[]");
  document.getElementById("savedQuotes").textContent = quotes.length;

  const words = JSON.parse(localStorage.getItem("enigma_saved_words_v2") || "[]");
  document.getElementById("savedWords").textContent = words.length;

  const moodSummary = document.getElementById("moodSummary");

  if(checkins.length){
    const counts = {};
    checkins.forEach(c=>{
      counts[c.mood] = (counts[c.mood]||0)+1;
    });
    moodSummary.innerHTML = Object.entries(counts)
      .map(([m,c])=>`<p>${m}: ${c}</p>`)
      .join("");
  } else {
    moodSummary.innerHTML = "<p>No mood data yet.</p>";
  }
}

document.getElementById("clearDataBtn").addEventListener("click", ()=>{
  if(confirm("Clear ALL saved data?")){
    localStorage.clear();
    updateStats();
  }
});

updateStats();
</script>
</body>
</html>
