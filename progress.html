<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Progress • Enigma Wellbeing</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />

  <style>
    .list{ display:flex; flex-direction:column; gap:12px; }
    .tile{ width:100%; min-height:92px; align-items:flex-start; }
    .tile-sub{ margin-top:2px; font-size:13px; }
    .stat{
      margin-left:auto;
      font-weight:700;
      opacity:.8;
      white-space:nowrap;
      font-size:14px;
    }
  </style>
</head>

<body>
  <div class="watermark" aria-hidden="true"></div>

  <main class="wrap">
    <div class="topbar">
      <a class="back" href="index.html">←</a>
      <div style="width:44px;"></div>
    </div>

    <h1 class="page-title">Progress</h1>
    <p class="page-sub">A simple overview across your pages.</p>

    <section class="card">
      <div class="list" id="list"></div>
      <hr class="sep" />
      <p class="small-note" id="note" style="margin:0;"></p>
    </section>
  </main>

  <script type="module">
    import { applySavedTheme, applySavedPreferences } from "./app.js";
    applySavedTheme(); applySavedPreferences();
  </script>

  <script>
    const KEYS = {
      checkins: "enigma_checkins_v2",
      journal: "enigma_journal_v2",
      wordHist: "enigma_word_history_v2",
      quotes: "enigma_saved_quotes_v2",
      books: "enigma_saved_books_v2"
    };

    function safeJSON(key, fallback){
      try{ return JSON.parse(localStorage.getItem(key) || fallback); }
      catch{ return JSON.parse(fallback); }
    }

    const checkins = safeJSON(KEYS.checkins, "[]");
    const journal = safeJSON(KEYS.journal, "[]"); // if yours is string or object, this still won’t crash
    const wordHist = safeJSON(KEYS.wordHist, "{}");
    const savedQuotes = safeJSON(KEYS.quotes, "[]");
    const savedBooks = safeJSON(KEYS.books, "[]");

    const wordDays = Object.keys(wordHist || {}).length;

    // simple streak for check-ins (by date)
    function dateOnly(iso){ return (iso || "").slice(0,10); }
    function calcStreak(entries){
      const set = new Set(entries.map(e => dateOnly(e.savedAt)).filter(Boolean));
      if(!set.size) return 0;
      let streak = 0;
      const d = new Date();
      while(true){
        const ds = d.toISOString().slice(0,10);
        if(set.has(ds)){
          streak++;
          d.setDate(d.getDate()-1);
        } else break;
      }
      return streak;
    }
    const checkinStreak = calcStreak(checkins);

    const items = [
      { ico:"📝", title:"Check-ins", sub:"Total saved check-ins", val: String(checkins.length) },
      { ico:"🔥", title:"Check-in streak", sub:"Days in a row (based on saves)", val: String(checkinStreak) },
      { ico:"📖", title:"Journal entries", sub:"Saved entries (if enabled)", val: Array.isArray(journal) ? String(journal.length) : "—" },
      { ico:"✨", title:"Daily words", sub:"Days with a word saved", val: String(wordDays) },
      { ico:"💜", title:"Saved quotes", sub:"Quotes you’ve saved", val: String(savedQuotes.length) },
      { ico:"📚", title:"Saved books", sub:"Books you’ve saved", val: String(savedBooks.length) }
    ];

    const list = document.getElementById("list");
    list.innerHTML = items.map(i => `
      <div class="tile">
        <div class="ico">${i.ico}</div>
        <div style="flex:1;">
          <div class="label small">${i.title}</div>
          <div class="tile-sub">${i.sub}</div>
        </div>
        <div class="stat">${i.val}</div>
      </div>
    `).join("");

    document.getElementById("note").textContent =
      "Progress here is based on what you’ve saved on this device.";
  </script>
</body>
</html>
