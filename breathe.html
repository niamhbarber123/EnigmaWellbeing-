<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Breathe • Enigma Wellbeing</title>

  <link rel="icon" href="icon.png" />
  <link rel="apple-touch-icon" href="icon.png" />
  <link rel="stylesheet" href="style.css?v=20260210b1" />
</head>

<body class="page-wrap breathe-page no-scroll">

  <!-- Back + Night mode -->
  <a class="back-btn" href="index.html" aria-label="Back to Home">←</a>
  <button id="themeFab" class="theme-toggle-top" type="button" aria-label="Toggle night mode">🌙</button>

  <header class="page-header">
    <h1>Breathe</h1>
    <p>Follow the rhythm</p>
  </header>

  <main class="page breathe-container">

    <!-- Settings -->
    <section class="card">
      <div class="section-title">Session</div>
      <div class="gentle-text">Choose a timer or stopwatch.</div>

      <div class="breathe-settings">
        <div class="field">
          <div class="form-label">Mode</div>
          <select id="modeSelect" class="select">
            <option value="timer">Timer</option>
            <option value="stopwatch">Stopwatch</option>
          </select>
        </div>

        <div class="field" id="minutesField">
          <div class="form-label">Minutes</div>
          <select id="minutesSelect" class="select">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="5" selected>5</option>
            <option value="10">10</option>
            <option value="15">15</option>
          </select>
        </div>
      </div>

      <div class="breathe-controls">
        <button id="startBtn" class="small-pill" type="button">Start</button>
        <button id="stopBtn" class="small-pill" type="button">Stop</button>
        <div id="completedPill" class="small-pill" style="display:none;">Completed ✅</div>
      </div>
    </section>

    <!-- Breath animation -->
    <section class="card breathe-stage-card">
      <div class="breathe-stage">
        <div id="breathCircle" class="breath-circle"></div>
        <div id="breathLabel" class="breath-label">Ready</div>
        <div id="timeDisplay" class="time-display">00:00</div>
      </div>
    </section>

  </main>

  <nav class="bottom-nav">
    <a href="index.html"><div class="nav-ico">🏠</div><span>Home</span></a>
    <a class="active" href="breathe.html"><div class="nav-ico">🌬️</div><span>Breathe</span></a>
    <a href="journal.html"><div class="nav-ico">📖</div><span>Journal</span></a>
    <a href="quotes.html"><div class="nav-ico">💬</div><span>Quotes</span></a>
    <a href="yoga.html"><div class="nav-ico">🧘‍♀️</div><span>Yoga</span></a>
    <a href="sounds.html"><div class="nav-ico">🎵</div><span>Music</span></a>
    <a href="progress.html"><div class="nav-ico">📈</div><span>Progress</span></a>
  </nav>

  <script src="app.js?v=20260210b1" defer></script>
  <script src="breathe.js?v=20260210b1" defer></script>
</body>
</html>
