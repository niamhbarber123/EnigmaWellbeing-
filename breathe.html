  <button id="themeFab" class="theme-toggle-top" type="button">🌙</button>

  <header class="page-header">
    <h1>Breathe</h1>
    <p>Follow the rhythm</p>
  </header>

  <main class="page breathe-container">

    <!-- Status -->
    <div class="card">
      <div class="section-title">Ready</div>
      <div class="gentle-text">Tap Start to begin.</div>
    </div>

    <!-- BREATH CIRCLE -->
    <div class="breathe-stage">
      <div id="breathCircle" class="breath-circle"></div>
      <div id="breathLabel" class="breath-label">Ready</div>
    </div>

    <!-- Controls -->
    <div class="card">
      <div class="section-title">Session</div>

      <div class="breathe-controls">
        <button id="startBtn" class="small-pill">Start</button>
        <button id="stopBtn" class="small-pill">Stop</button>
        <div id="completedPill" class="small-pill" style="display:none;">Completed ✅</div>
      </div>
    </div>

  </main>
