<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Breathe • Enigma Wellbeing</title>

  <link rel="icon" href="icon.png" />
  <link rel="apple-touch-icon" href="icon.png" />
  <link rel="stylesheet" href="style.css?v=20260210b4" />
</head>

<body class="page-wrap breathe-page no-scroll">
  <a class="back-btn" href="index.html" aria-label="Back to Home">←</a>
  <button id="themeFab" class="theme-toggle-top" type="button" aria-label="Toggle night mode">🌙</button>

  <header class="page-header breathe-header-compact">
    <h1>Breathe</h1>
    <p>Follow the rhythm</p>
  </header>

  <main class="page breathe-fit">
    <!-- READY CARD -->
    <section class="card breathe-ready-card">
      <div class="breathe-ready-top">
        <div class="breathe-ready-title" id="topTitle">Ready</div>
        <div class="breathe-ready-sub" id="topHint">Tap Start to begin.</div>
      </div>

      <div class="breathe-circle-wrap">
        <div id="breathCircle" class="breath-circle"></div>
      </div>

      <div class="breathe-status">
        <div id="breathLabel" class="breath-label">Ready</div>
        <div id="timeDisplay" class="time-display">Time: —</div>
      </div>
    </section>

    <!-- SESSION CARD -->
    <section class="card breathe-session-card">
      <div class="section-title">Session</div>
      <div class="gentle-text">Choose your mode, then press Start.</div>

      <div class="breathe-form">
        <div class="form-row">
          <div class="form-label">Mode</div>
          <select id="modeSelect" class="select" aria-label="Mode">
            <option value="timer" selected>Timer</option>
            <option value="stopwatch">Stopwatch</option>
          </select>
          <div class="mini-hint">Timer counts down. Stopwatch counts up.</div>
        </div>

        <div class="form-row" id="minutesField">
          <div class="form-label">Timer length</div>
          <select id="minutesSelect" class="select" aria-label="Timer length">
            <option value="1" selected>1 minute</option>
            <option value="2">2 minutes</option>
            <option value="3">3 minutes</option>
            <option value="5">5 minutes</option>
            <option value="10">10 minutes</option>
            <option value="15">15 minutes</option>
          </select>
        </div>

        <label class="vibration-row" for="vibrationToggle">
          <input id="vibrationToggle" type="checkbox" />
          <span>Vibration cues</span>
        </label>
      </div>

      <div class="breathe-controls">
        <button id="startBtn" class="small-pill" type="button">Start</button>
        <button id="pauseBtn" class="small-pill" type="button">Pause</button>
        <button id="resetBtn" class="small-pill" type="button">Reset</button>
        <div id="completedPill" class="small-pill completed-pill" style="display:none;">Completed ✅</div>
      </div>
    </section>
  </main>

  <nav class="bottom-nav">
    <a href="index.html"><div class="nav-ico">🏠</div><span>Home</span></a>
    <a class="active" href="breathe.html"><div class="nav-ico">🌬️</div><span>Breathe</span></a>
    <a href="journal.html"><div class="nav-ico">📖</div><span>Journal</span></a>
    <a href="quotes.html"><div class="nav-ico">💬</div><span>Quotes</span></a>
    <a href="yoga.html"><div class="nav-ico">🧘‍♀️</div><span>Yoga</span></a>
    <a href="sounds.html"><div class="nav-ico">🎵</div><span>Music</span></a>
    <a href="progress.html"><div class="nav-ico">📈</div><span>Progress</span></a>
  </nav>

  <script src="app.js?v=20260210b4" defer></script>
  <script src="breathe.js?v=20260210b4" defer></script>
</body>
</html>
