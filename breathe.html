<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Breathe • Enigma Wellbeing</title>

  <link rel="icon" href="icon.png" />
  <link rel="apple-touch-icon" href="icon.png" />
  <link rel="stylesheet" href="style.css?v=20260209z" />
</head>

<body class="page-wrap">
  <button class="back-btn" type="button" onclick="location.href='index.html'">←</button>
  <button id="themeFab" class="theme-toggle-top" type="button" aria-label="Toggle night mode">🌙</button>

  <header class="page-header">
    <h1>Breathe</h1>
    <p>Follow the rhythm</p>
  </header>

  <main class="page">
    <div class="card">
      <div class="section-title">Ready</div>
      <div class="gentle-text" style="margin-top:6px;">Tap Start to begin.</div>

      <div class="breathe-wrap">
        <div id="breatheCircle" class="breathe-circle"></div>
        <div id="breathePhase" class="breathe-status">Ready</div>
        <div id="breatheTimer" class="breathe-sub">Time: —</div>
      </div>

      <div class="card" style="margin-top:14px;">
        <div class="section-title">Session</div>

        <div class="form-row">
          <div class="form-label">Mode</div>
          <select id="modeSel" class="select">
            <option value="timer">Timer</option>
          </select>

          <div class="form-label">Timer length</div>
          <select id="lengthSel" class="select">
            <option value="1">1 min</option>
            <option value="2">2 min</option>
            <option value="3">3 min</option>
            <option value="5">5 min</option>
          </select>

          <div class="checkbox-row">
            <input id="vibrateChk" type="checkbox" />
            <label for="vibrateChk">Vibration</label>
          </div>

          <div class="gentle-text">Time: <span id="timeReadout">—</span></div>
        </div>
      </div>

      <div class="row" style="margin-top:14px;">
        <button id="startBtn" class="btn primary" type="button">Start</button>
        <button id="stopBtn" class="btn" type="button">Stop</button>
      </div>

      <div style="margin-top:12px;">
        <span id="completedPill" class="mini-pill" style="display:none;">Completed ✅</span>
      </div>
    </div>
  </main>

  <nav class="bottom-nav">
    <a href="index.html"><div class="nav-ico">🏠</div><span>Home</span></a>
    <a class="active" href="breathe.html"><div class="nav-ico">🌬️</div><span>Breathe</span></a>
    <a href="journal.html"><div class="nav-ico">📖</div><span>Journal</span></a>
    <a href="quotes.html"><div class="nav-ico">💬</div><span>Quotes</span></a>
    <a href="yoga.html"><div class="nav-ico">🧘‍♀️</div><span>Yoga</span></a>
    <a href="sounds.html"><div class="nav-ico">🎵</div><span>Music</span></a>
    <a href="progress.html"><div class="nav-ico">📈</div><span>Progress</span></a>
  </nav>

  <script src="app.js?v=20260209z" defer></script>
  <script src="breathe.js?v=20260209z" defer></script>
</body>
</html>
