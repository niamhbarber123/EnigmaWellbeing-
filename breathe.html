<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Breathe • Enigma Wellbeing</title>
  <link rel="stylesheet" href="style.css" />

  <style>
    /* Breathe-specific styling that matches Home (soft card + clean center) */
    .breathe-card{ text-align:center; }

    .breathe-circle{
      width: 220px;
      height: 220px;
      border-radius: 50%;
      margin: 14px auto 10px;
      background: radial-gradient(circle at 35% 30%,
        rgba(255,255,255,.75) 0%,
        rgba(200,186,255,.42) 42%,
        rgba(200,186,255,.22) 100%
      );
      border: 1px solid var(--stroke);
      box-shadow: var(--shadow2);
      display:flex;
      align-items:center;
      justify-content:center;
      transform: scale(1);
      transition: transform 4000ms ease-in-out;
      position: relative;
      overflow: hidden;
    }
    body.dark .breathe-circle{
      background: radial-gradient(circle at 35% 30%,
        rgba(255,255,255,.14) 0%,
        rgba(200,186,255,.16) 42%,
        rgba(200,186,255,.10) 100%
      );
    }

    .breathe-phase{
      font-size: 16px;
      font-weight: 600;
      opacity: .8;
      margin-top: 6px;
    }
    .breathe-time{
      font-size: 26px;
      font-weight: 650;
      letter-spacing: .5px;
    }
    .breathe-hint{
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
      margin: 4px 0 0;
    }

    /* Home-like control layout */
    .control-grid{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 12px;
      text-align:left;
    }
    @media (max-width:380px){
      .control-grid{ grid-template-columns: 1fr; }
      .breathe-circle{ width: 200px; height: 200px; }
    }
    .control label{
      display:block;
      font-size: 12px;
      font-weight: 600;
      opacity: .7;
      margin: 0 0 6px;
    }

    /* Small pattern line */
    .pattern{
      margin-top: 10px;
      font-size: 13px;
      font-weight: 600;
      opacity: .75;
      text-align:center;
    }
  </style>
</head>

<body>
  <div class="watermark" aria-hidden="true"></div>

  <main class="wrap">
    <div class="topbar">
      <a class="back" href="index.html"></a>
      <button class="moon" data-theme-toggle aria-label="Night mode">🌙</button>
    </div>

    <h1 class="page-title">Breathe</h1>
    <p class="page-sub">Follow the rhythm. Slow in, slower out.</p>

    <section class="card breathe-card">
      <!-- Circle -->
      <div class="breathe-circle" id="circle">
        <div>
          <div class="breathe-time" id="timeDisplay">00:00</div>
        </div>
      </div>

      <div class="breathe-phase" id="phaseText">Ready</div>
      <p class="breathe-hint" id="hintText">Choose options and press Start.</p>

      <!-- Controls (Home-style) -->
      <div class="control-grid">
        <div class="control">
          <label for="breathType">Breathing option</label>
          <select id="breathType">
            <option value="box">Box (4–4–4–4)</option>
            <option value="calm" selected>Calm (4–2–6)</option>
            <option value="balanced">Balanced (5–2–5)</option>
          </select>
        </div>

        <div class="control">
          <label for="speedSelect">Speed</label>
          <select id="speedSelect">
            <option value="slow">Slow</option>
            <option value="medium" selected>Medium</option>
            <option value="fast">Fast</option>
          </select>
        </div>

        <div class="control">
          <label for="modeSelect">Mode</label>
          <select id="modeSelect">
            <option value="timer" selected>Timer</option>
            <option value="stopwatch">Stopwatch</option>
          </select>
        </div>

        <div class="control" id="timeOptions">
          <label for="timeSelect">Duration</label>
          <select id="timeSelect">
            <option value="1">1 minute</option>
            <option value="2">2 minutes</option>
            <option value="3">3 minutes</option>
            <option value="5">5 minutes</option>
            <option value="10">10 minutes</option>
          </select>
        </div>
      </div>

      <div class="pattern" id="patternText">Inhale 4 • Hold 2 • Exhale 6</div>

      <hr class="sep">

      <div class="btn-row">
        <button class="btn primary" id="startBtn" type="button">Start</button>
        <button class="btn" id="stopBtn" type="button">Stop</button>
        <button class="btn" id="resetBtn" type="button">Reset</button>
      </div>
    </section>
  </main>

  <script type="module">
    import { applySavedTheme, wireThemeButton } from "./app.js";
    applySavedTheme();
    wireThemeButton();
  </script>

  <script>
    const circle = document.getElementById("circle");
    const phaseText = document.getElementById("phaseText");
    const hintText = document.getElementById("hintText");
    const timeDisplay = document.getElementById("timeDisplay");
    const patternText = document.getElementById("patternText");

    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");
    const resetBtn = document.getElementById("resetBtn");

    const breathType = document.getElementById("breathType");
    const speedSelect = document.getElementById("speedSelect");
    const modeSelect = document.getElementById("modeSelect");
    const timeSelect = document.getElementById("timeSelect");
    const timeOptions = document.getElementById("timeOptions");

    let running = false;
    let phaseTimeout = null;
    let timerInterval = null;

    let inhaleMs = 4000;
    let holdMs = 2000;
    let exhaleMs = 6000;
    let hold2Ms = 0;

    let seconds = 0;

    function mult(){
      return speedSelect.value === "slow" ? 1.3 :
             speedSelect.value === "fast" ? 0.8 : 1;
    }

    function updatePattern(){
      const k = mult();

      if (breathType.value === "box"){
        inhaleMs = 4000 * k;
        holdMs   = 4000 * k;
        exhaleMs = 4000 * k;
        hold2Ms  = 4000 * k;
      } else if (breathType.value === "balanced"){
        inhaleMs = 5000 * k;
        holdMs   = 2000 * k;
        exhaleMs = 5000 * k;
        hold2Ms  = 0;
      } else { // calm
        inhaleMs = 4000 * k;
        holdMs   = 2000 * k;
        exhaleMs = 6000 * k;
        hold2Ms  = 0;
      }

      const inh = Math.round(inhaleMs/1000);
      const hol = Math.round(holdMs/1000);
      const exh = Math.round(exhaleMs/1000);
      const hol2 = Math.round(hold2Ms/1000);

      patternText.textContent =
        (hold2Ms > 0)
          ? `Inhale ${inh} • Hold ${hol} • Exhale ${exh} • Hold ${hol2}`
          : `Inhale ${inh} • Hold ${hol} • Exhale ${exh}`;
    }

    function fmt(sec){
      const m = String(Math.floor(sec/60)).padStart(2,"0");
      const s = String(sec%60).padStart(2,"0");
      return `${m}:${s}`;
    }

    function clearAll(){
      if (phaseTimeout) { clearTimeout(phaseTimeout); phaseTimeout = null; }
      if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
    }

    function setCircleScale(scale, durationMs){
      circle.style.transitionDuration = durationMs + "ms";
      circle.style.transform = `scale(${scale})`;
    }

    function inhale(){
      phaseText.textContent = "Inhale";
      hintText.textContent = "Breathe in slowly.";
      // animate to large
      setCircleScale(1.18, inhaleMs);
    }

    /* ✅ HOLD FIX:
       - Do NOT change transform at all
       - Do NOT animate
       - Circle stays exactly where inhale/exhale left it
    */
    function hold(){
      phaseText.textContent = "Hold";
      hintText.textContent = "Pause gently.";
      circle.style.transitionDuration = "0ms";
      // no transform change — keeps current size
    }

    function exhale(){
      phaseText.textContent = "Exhale";
      hintText.textContent = "Breathe out slowly.";
      // animate to small
      setCircleScale(1.0, exhaleMs);
    }

    function loop(){
      if (!running) return;

      inhale();
      phaseTimeout = setTimeout(()=>{
        if (!running) return;

        hold();
        phaseTimeout = setTimeout(()=>{
          if (!running) return;

          exhale();
          phaseTimeout = setTimeout(()=>{
            if (!running) return;

            if (hold2Ms > 0){
              hold();
              phaseTimeout = setTimeout(loop, hold2Ms);
            } else {
              loop();
            }
          }, exhaleMs);

        }, holdMs);

      }, inhaleMs);
    }

    function start(){
      if (running) return;
      running = true;
      updatePattern();

      if (modeSelect.value === "timer"){
        seconds = parseInt(timeSelect.value,10) * 60;
        timeDisplay.textContent = fmt(seconds);

        timerInterval = setInterval(()=>{
          seconds--;
          timeDisplay.textContent = fmt(Math.max(0, seconds));
          if (seconds <= 0) stop(true);
        }, 1000);
      } else {
        seconds = 0;
        timeDisplay.textContent = "00:00";
        timerInterval = setInterval(()=>{
          seconds++;
          timeDisplay.textContent = fmt(seconds);
        }, 1000);
      }

      loop();
    }

    function stop(finished=false){
      running = false;
      clearAll();

      if (finished){
        phaseText.textContent = "Done";
        hintText.textContent = "Nice work.";
      } else {
        phaseText.textContent = "Paused";
        hintText.textContent = "Press Start when you’re ready.";
      }
    }

    function reset(){
      stop(false);
      timeDisplay.textContent = "00:00";
      phaseText.textContent = "Ready";
      hintText.textContent = "Choose options and press Start.";
      setCircleScale(1.0, 200);
      updatePattern();
    }

    modeSelect.addEventListener("change", ()=>{
      timeOptions.style.display = (modeSelect.value === "timer") ? "block" : "none";
      if (!running) timeDisplay.textContent = "00:00";
    });

    breathType.addEventListener("change", updatePattern);
    speedSelect.addEventListener("change", updatePattern);

    startBtn.addEventListener("click", start);
    stopBtn.addEventListener("click", ()=>stop(false));
    resetBtn.addEventListener("click", reset);

    // init
    updatePattern();
    timeOptions.style.display = (modeSelect.value === "timer") ? "block" : "none";
  </script>
</body>
</html>
