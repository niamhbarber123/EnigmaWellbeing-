<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Breathe • Enigma Wellbeing</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="watermark" aria-hidden="true"></div>

  <main class="wrap">
    <div class="topbar">
      <a class="back" href="index.html">← Back</a>
      <button class="moon" data-theme-toggle aria-label="Night mode">🌙</button>
    </div>

    <h1 class="page-title" style="font-weight:600;">Breathe</h1>
    <p class="page-sub" style="font-weight:500;">
      Slow down. Follow the rhythm.
    </p>

    <section class="card" style="text-align:center;">

      <!-- Breathing Style -->
      <label style="font-weight:500;">Breathing style</label>
      <select id="breathType" style="margin-bottom:12px;">
        <option value="box">Box (4-4-4-4)</option>
        <option value="calm" selected>Calm (4-2-6)</option>
        <option value="balanced">Balanced (5-2-5)</option>
      </select>

      <!-- Speed -->
      <label style="font-weight:500;">Speed</label>
      <select id="speedSelect" style="margin-bottom:12px;">
        <option value="slow">Slow</option>
        <option value="medium" selected>Medium</option>
        <option value="fast">Fast</option>
      </select>

      <!-- Mode -->
      <label style="font-weight:500;">Mode</label>
      <select id="modeSelect" style="margin-bottom:12px;">
        <option value="timer" selected>Timer</option>
        <option value="stopwatch">Stopwatch</option>
      </select>

      <!-- Timer Length -->
      <div id="timeOptions">
        <label style="font-weight:500;">Duration</label>
        <select id="timeSelect" style="margin-bottom:14px;">
          <option value="1">1 minute</option>
          <option value="2">2 minutes</option>
          <option value="3">3 minutes</option>
          <option value="5">5 minutes</option>
          <option value="10">10 minutes</option>
        </select>
      </div>

      <!-- Timer Display -->
      <div id="timeDisplay" style="font-size:20px; font-weight:600; margin-bottom:10px;">
        00:00
      </div>

      <!-- Circle -->
      <div id="circle"
        style="
          width:180px;
          height:180px;
          margin:20px auto;
          border-radius:50%;
          background:#c8baff;
          display:flex;
          align-items:center;
          justify-content:center;
          color:#fff;
          font-size:18px;
          font-weight:600;
          transition:transform 4s ease-in-out;
        ">
        Ready
      </div>

      <div style="margin-top:16px;" class="btn-row">
        <button class="btn primary" id="startBtn">Start</button>
        <button class="btn" id="stopBtn">Stop</button>
        <button class="btn" id="resetBtn">Reset</button>
      </div>

    </section>
  </main>

  <script type="module">
    import { applySavedTheme, wireThemeButton } from "./app.js";
    applySavedTheme();
    wireThemeButton();
  </script>

  <script>
    const circle = document.getElementById("circle");
    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");
    const resetBtn = document.getElementById("resetBtn");

    const breathType = document.getElementById("breathType");
    const speedSelect = document.getElementById("speedSelect");
    const modeSelect = document.getElementById("modeSelect");
    const timeSelect = document.getElementById("timeSelect");
    const timeOptions = document.getElementById("timeOptions");
    const timeDisplay = document.getElementById("timeDisplay");

    let breathInterval = null;
    let phaseTimeout = null;
    let timerInterval = null;

    let inhaleMs = 4000;
    let holdMs = 2000;
    let exhaleMs = 6000;
    let hold2Ms = 0;      // only used for box breathing
    let running = false;

    let seconds = 0;

    function mult(){
      return speedSelect.value === "slow" ? 1.3 :
             speedSelect.value === "fast" ? 0.8 : 1;
    }

    function updatePattern(){
      const k = mult();

      if (breathType.value === "box"){
        inhaleMs = 4000 * k;
        holdMs   = 4000 * k;
        exhaleMs = 4000 * k;
        hold2Ms  = 4000 * k; // second hold after exhale
      } else if (breathType.value === "balanced"){
        inhaleMs = 5000 * k;
        holdMs   = 2000 * k;
        exhaleMs = 5000 * k;
        hold2Ms  = 0;
      } else { // calm
        inhaleMs = 4000 * k;
        holdMs   = 2000 * k;
        exhaleMs = 6000 * k;
        hold2Ms  = 0;
      }
    }

    function fmt(sec){
      const m = String(Math.floor(sec/60)).padStart(2,"0");
      const s = String(sec%60).padStart(2,"0");
      return `${m}:${s}`;
    }

    function clearAllTimers(){
      clearInterval(breathInterval);
      clearInterval(timerInterval);
      clearTimeout(phaseTimeout);
      breathInterval = timerInterval = phaseTimeout = null;
    }

    function inhale(){
      circle.textContent = "Inhale";
      circle.style.transitionDuration = inhaleMs + "ms";
      circle.style.transform = "scale(1.2)";
    }

    function hold(){
      circle.textContent = "Hold";
      // keep size steady during hold
    }

    function exhale(){
      circle.textContent = "Exhale";
      circle.style.transitionDuration = exhaleMs + "ms";
      circle.style.transform = "scale(1)";
    }

    function hold2(){
      circle.textContent = "Hold";
    }

    function runCycle(){
      if (!running) return;

      inhale();
      phaseTimeout = setTimeout(()=>{
        if (!running) return;

        hold();
        phaseTimeout = setTimeout(()=>{
          if (!running) return;

          exhale();
          phaseTimeout = setTimeout(()=>{
            if (!running) return;

            if (hold2Ms > 0){
              hold2();
              phaseTimeout = setTimeout(()=>{
                if (!running) return;
                runCycle();
              }, hold2Ms);
            } else {
              runCycle();
            }

          }, exhaleMs);

        }, holdMs);

      }, inhaleMs);
    }

    function startBreathing(){
      if (running) return;
      running = true;
      updatePattern();

      // timer/stopwatch
      if (modeSelect.value === "timer"){
        seconds = parseInt(timeSelect.value,10) * 60;
        timeDisplay.textContent = fmt(seconds);

        timerInterval = setInterval(()=>{
          seconds--;
          timeDisplay.textContent = fmt(Math.max(0, seconds));
          if (seconds <= 0) stopBreathing(true);
        }, 1000);
      } else {
        seconds = 0;
        timeDisplay.textContent = "00:00";
        timerInterval = setInterval(()=>{
          seconds++;
          timeDisplay.textContent = fmt(seconds);
        }, 1000);
      }

      runCycle();
    }

    function stopBreathing(finished=false){
      running = false;
      clearAllTimers();
      if (finished) circle.textContent = "Done";
    }

    function resetBreathing(){
      stopBreathing(false);
      timeDisplay.textContent = "00:00";
      circle.textContent = "Ready";
      circle.style.transform = "scale(1)";
    }

    modeSelect.addEventListener("change", () => {
      timeOptions.style.display = modeSelect.value === "timer" ? "block" : "none";
    });

    startBtn.addEventListener("click", startBreathing);
    stopBtn.addEventListener("click", ()=>stopBreathing(false));
    resetBtn.addEventListener("click", resetBreathing);
  </script>
</body>
</html>
