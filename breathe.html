<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Breathe • Enigma Wellbeing</title>

  <link rel="icon" href="icon.png" />
  <link rel="apple-touch-icon" href="icon.png" />
  <link rel="stylesheet" href="style.css?v=99901" />
</head>

<body class="page-wrap">
  <button id="themeFab" class="theme-toggle-top" type="button" aria-label="Toggle night mode">🌙</button>

  <header class="page-header">
    <button class="back-btn" type="button" onclick="enigmaHome()">←</button>
    <h1>Breathe</h1>
    <p>Follow the rhythm</p>
  </header>

  <main class="page" id="breathePage">
    <div class="card">
      <div class="section-title" id="breathPhase">Ready</div>

      <div class="breathe-stage">
        <div class="breathe-ring">
          <div class="breathe-circle" id="breatheCircle"></div>
        </div>
      </div>

      <div class="breath-text" id="breathTip">Tap Start to begin.</div>

      <!-- Session controls -->
      <div class="card" style="margin-top:12px;">
        <div class="section-title">Session</div>

        <div class="tool-row" style="margin-top:10px;">
          <div style="flex:1; min-width:160px;">
            <div class="gentle-text" style="margin-bottom:6px;">Mode</div>
            <select id="breathModeSelect" class="input">
              <option value="timer">Timer</option>
              <option value="stopwatch">Stopwatch</option>
            </select>
          </div>

          <div id="breathDurationRow" style="flex:1; min-width:160px;">
            <div class="gentle-text" style="margin-bottom:6px;">Timer length</div>
            <select id="breathDurationSelect" class="input">
              <option value="1">1 min</option>
              <option value="2">2 min</option>
              <option value="3">3 min</option>
              <option value="5">5 min</option>
              <option value="10">10 min</option>
            </select>
          </div>
        </div>

        <div style="margin-top:10px;">
          <label class="gentle-text" style="display:flex; align-items:center; gap:10px; font-weight:900;">
            <input id="breathVibrateToggle" type="checkbox" />
            Vibration
          </label>
        </div>

        <div class="gentle-text" id="breathTimerLabel" style="margin-top:8px;">Time: —</div>
        <div class="gentle-text" id="breathStopwatchLabel" style="margin-top:6px; display:none;">Stopwatch: 0:00</div>
      </div>

      <div class="tool-row" style="margin-top:14px;">
        <button class="tool-btn primary" id="breathStartBtn" type="button">Start</button>
        <button class="tool-btn danger" id="breathStopBtn" type="button">Stop</button>
      </div>

      <div class="tool-row" style="margin-top:10px;">
        <button class="tool-btn" id="breathCompleteBtn" type="button">Completed ✅</button>
      </div>
    </div>
  </main>

  <nav class="bottom-nav">
    <a href="index.html"><div class="nav-ico">🏠</div><span>Home</span></a>
    <a class="active" href="breathe.html"><div class="nav-ico">🌬️</div><span>Breathe</span></a>
    <a href="journal.html"><div class="nav-ico">📖</div><span>Journal</span></a>
    <a href="quotes.html"><div class="nav-ico">💬</div><span>Quotes</span></a>
    <a href="yoga.html"><div class="nav-ico">🧘‍♀️</div><span>Yoga</span></a>
    <a href="sounds.html"><div class="nav-ico">🎵</div><span>Music</span></a>
    <a href="progress.html"><div class="nav-ico">📈</div><span>Progress</span></a>
  </nav>

  <script src="app.js?v=99901" defer></script>
</body>
</html>
