<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Breathe • Enigma Wellbeing</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="watermark" aria-hidden="true"></div>

  <main class="wrap">

    <div class="topbar">
      <a class="back" href="index.html">← Back</a>
      <button class="moon" data-theme-toggle aria-label="Night mode">🌙</button>
    </div>

    <h1 class="page-title" style="font-weight:600;">Breathe</h1>
    <p class="page-sub" style="font-weight:500;">
      Slow down. Follow the rhythm.
    </p>

    <section class="card" style="text-align:center;">

      <!-- Breathing type dropdown -->
      <label style="font-weight:500; display:block; margin-bottom:6px;">
        Breathing style
      </label>

      <select id="breathType" style="margin-bottom:14px;">
        <option value="4-4">Box (4-4-4-4)</option>
        <option value="4-6">Calm (4 in, 6 out)</option>
        <option value="5-5">Balanced (5 in, 5 out)</option>
      </select>

      <!-- Breathing circle -->
      <div id="circle"
        style="
          width:180px;
          height:180px;
          margin:20px auto;
          border-radius:50%;
          background:#c8baff;
          display:flex;
          align-items:center;
          justify-content:center;
          color:#fff;
          font-size:18px;
          font-weight:600;
          transition:transform 4s ease-in-out;
        ">
        Inhale
      </div>

      <div style="margin-top:16px;">
        <button class="btn primary" id="startBtn">Start</button>
      </div>

    </section>
  </main>

  <script type="module">
    import { applySavedTheme, wireThemeButton } from "./app.js";
    applySavedTheme();
    wireThemeButton();
  </script>

  <script>
    const circle = document.getElementById("circle");
    const startBtn = document.getElementById("startBtn");
    const breathType = document.getElementById("breathType");

    let interval;
    let inhaleTime = 4000;
    let exhaleTime = 4000;

    function setPattern(type){
      if(type === "4-4"){
        inhaleTime = 4000;
        exhaleTime = 4000;
      }
      if(type === "4-6"){
        inhaleTime = 4000;
        exhaleTime = 6000;
      }
      if(type === "5-5"){
        inhaleTime = 5000;
        exhaleTime = 5000;
      }
    }

    function startBreathing(){
      clearInterval(interval);

      setPattern(breathType.value);

      function inhale(){
        circle.textContent = "Inhale";
        circle.style.transform = "scale(1.2)";
        circle.style.transitionDuration = inhaleTime + "ms";
      }

      function exhale(){
        circle.textContent = "Exhale";
        circle.style.transform = "scale(1)";
        circle.style.transitionDuration = exhaleTime + "ms";
      }

      inhale();
      setTimeout(exhale, inhaleTime);

      interval = setInterval(() => {
        inhale();
        setTimeout(exhale, inhaleTime);
      }, inhaleTime + exhaleTime);
    }

    startBtn.addEventListener("click", startBreathing);
  </script>
</body>
</html>
