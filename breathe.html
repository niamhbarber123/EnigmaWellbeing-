<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Breathe • Enigma Wellbeing</title>

  <link rel="icon" href="icon.png" />
  <link rel="apple-touch-icon" href="icon.png" />
  <link rel="stylesheet" href="style.css?v=20260209-final" />
</head>

<body class="page-wrap breathe-page no-scroll">
  <button class="back-btn" type="button" onclick="location.href='index.html'">←</button>
  <button id="themeFab" class="theme-toggle-top" type="button" aria-label="Toggle night mode">🌙</button>

  <header class="page-header">
    <h1>Breathe</h1>
    <p>Follow the rhythm</p>
  </header>

  <main class="page">
    <div class="breathe-viewport">

      <!-- READY -->
      <section class="card breathe-ready-card">
        <div class="breathe-ready-title">Ready</div>
        <div class="breathe-ready-sub">Choose settings, then tap Start.</div>

        <div class="breathe-time-top">
          Time: <span id="timeText">01:00</span>
        </div>

        <div class="breathe-circle-wrap">
          <div id="breathCircle" class="breath-circle" aria-hidden="true"></div>
        </div>
      </section>

      <!-- SESSION -->
      <section class="card breathe-session-card">
        <div class="section-title">Session</div>
        <div class="gentle-text" style="margin-top:6px;">Timer counts down. Stopwatch counts up.</div>

        <div class="session-grid">
          <div class="field">
            <div class="label">Mode</div>
            <select id="modeSelect" aria-label="Mode">
              <option value="timer" selected>Timer</option>
              <option value="stopwatch">Stopwatch</option>
            </select>
            <div class="hint">Choose timer or stopwatch.</div>
          </div>

          <div class="field" id="minutesField">
            <div class="label">Timer length</div>
            <select id="minutesSelect" aria-label="Timer length">
              <option value="1" selected>1 minute</option>
              <option value="2">2 minutes</option>
              <option value="3">3 minutes</option>
              <option value="5">5 minutes</option>
              <option value="10">10 minutes</option>
            </select>
            <div class="hint">Choose minutes.</div>
          </div>
        </div>

        <div class="breathe-controls">
          <div class="row three">
            <button id="startBtn" class="btn primary" type="button">Start</button>
            <button id="pauseBtn" class="btn" type="button">Pause</button>
            <button id="resetBtn" class="btn" type="button">Reset</button>
          </div>

          <div id="completedPill" class="gentle-text" style="margin-top:10px; display:none; font-weight:900;">
            Completed ✅
          </div>
        </div>
      </section>

    </div>
  </main>

  <nav class="bottom-nav">
    <a href="index.html"><div class="nav-ico">🏠</div><span>Home</span></a>
    <a href="breathe.html"><div class="nav-ico">🌬️</div><span>Breathe</span></a>
    <a href="journal.html"><div class="nav-ico">📖</div><span>Journal</span></a>
    <a href="quotes.html"><div class="nav-ico">💬</div><span>Quotes</span></a>
    <a href="yoga.html"><div class="nav-ico">🧘‍♀️</div><span>Yoga</span></a>
    <a href="sounds.html"><div class="nav-ico">🎵</div><span>Music</span></a>
    <a href="progress.html"><div class="nav-ico">📈</div><span>Progress</span></a>
  </nav>

  <script src="app.js?v=20260209-final" defer></script>
  <script src="breathe.js?v=20260209-final" defer></script>
</body>
</html>
