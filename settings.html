<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Settings • Enigma</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#c8baff">
  <link rel="apple-touch-icon" href="icon.png">
</head>

<body>
  <div class="watermark" aria-hidden="true"></div>
  <main class="wrap">
    <div class="topbar">
      <a class="back" href="index.html" data-back>← Back</a>
      <button class="moon" data-theme-toggle aria-label="Night mode">🌙</button>
    </div>

    <h1 class="page-title">Settings</h1>
    <p class="page-sub">Simple controls.</p>

    <section class="card">
      <div class="full">
        <div class="quote-tile">
          <div class="quote-text">🌙 Night mode</div>
          <div class="quote-meta">Use the moon button in the top right on any page.</div>
        </div>

        <div class="quote-tile">
          <div class="quote-text">🧽 Clear local data</div>
          <div class="quote-meta">Clears check-ins, journal entries, breathing logs, saved quotes and contacts (on this device).</div>
          <button class="save-fab" id="clearAll" type="button" title="Clear">🧽</button>
        </div>
      </div>

      <p id="msg" style="margin:10px 0 0;color:var(--muted);font-weight:650;"></p>
    </section>
  </main>

  <script type="module">
    import { applySavedTheme, wireThemeButton, wireBackButton, registerServiceWorker } from "./app.js";
    applySavedTheme(); wireThemeButton(); wireBackButton(); registerServiceWorker();

    const msg=document.getElementById("msg");
    document.getElementById("clearAll").addEventListener("click", ()=>{
      const keys=[
        "enigma_checkins_v2",
        "enigma_journal_v2",
        "enigma_breathe_logs_v2",
        "enigma_quotes_saved_v2",
        "enigma_help_contacts_v2"
      ];
      keys.forEach(k=>localStorage.removeItem(k));
      msg.textContent="Cleared saved data on this device.";
    });
  </script>
</body>
</html>
