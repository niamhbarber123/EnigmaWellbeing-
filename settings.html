<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Settings • Enigma Wellbeing</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="watermark" aria-hidden="true"></div>

  <main class="wrap">
    <div class="topbar">
      <a class="back" href="index.html">←</a>
      <div style="width:44px;"></div>
    </div>

    <h1 class="page-title">Settings</h1>
    <p class="page-sub">Choose your app colour and font size.</p>

    <section class="card">

      <label class="small-note" style="display:block; font-weight:600; opacity:.75; margin-bottom:6px;">App colour</label>
      <select id="accent">
        <option value="lavender">Lavender</option>
        <option value="blush">Blush</option>
        <option value="mint">Mint</option>
        <option value="sky">Sky blue</option>
      </select>

      <div style="height:14px;"></div>

      <label class="small-note" style="display:block; font-weight:600; opacity:.75; margin-bottom:6px;">Font size</label>
      <select id="textSize">
        <option value="small">Small</option>
        <option value="default">Default</option>
        <option value="large">Large</option>
      </select>

      <p class="small-note" id="msg" style="margin-top:12px;"></p>
    </section>
  </main>

  <script type="module">
    import { applySavedTheme, applySavedPreferences, applyAccent, applyTextSize } from "./app.js";
    applySavedTheme();
    applySavedPreferences();

    const accent = document.getElementById("accent");
    const textSize = document.getElementById("textSize");
    const msg = document.getElementById("msg");

    // Load current saved selections
    accent.value = localStorage.getItem("enigma_accent_v2") || "lavender";
    textSize.value = localStorage.getItem("enigma_textsize_v2") || "default";

    accent.addEventListener("change", ()=>{
      applyAccent(accent.value);
      msg.textContent = "Saved.";
      setTimeout(()=>msg.textContent="", 900);
    });

    textSize.addEventListener("change", ()=>{
      applyTextSize(textSize.value);
      msg.textContent = "Saved.";
      setTimeout(()=>msg.textContent="", 900);
    });
  </script>
</body>
</html>
