<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Distraction • Enigma Wellbeing</title>

  <link rel="icon" href="icon.png" />
  <link rel="apple-touch-icon" href="icon.png" />

  <!-- cache-bust -->
  <link rel="stylesheet" href="style.css?v=20260210d1" />
</head>

<body class="page-wrap">
  <!-- Back ALWAYS goes home (same as the rest) -->
  <a class="back-btn" href="index.html" aria-label="Back to Home">←</a>

  <!-- Night mode (top-right on all pages) -->
  <button id="themeFab" class="theme-toggle-top" type="button" aria-label="Toggle night mode">🌙</button>

  <header class="page-header">
    <h1>Distraction</h1>
    <p>Gentle questions to interrupt a spiral</p>
  </header>

  <main class="page">
    <div class="card">
      <div class="gentle-text" style="line-height:1.5;">
        Type any answer to continue — or Skip. Progress counts only answered.
      </div>

      <div class="gentle-text" style="margin-top:10px; font-weight:900;">
        Tap Start to begin.
      </div>

      <div class="gentle-text" style="margin-top:10px;">
        Answered: <strong><span id="answeredCount">0</span></strong>
      </div>

      <div style="margin-top:14px;">
        <button id="startDistraction" class="small-pill" type="button">Start</button>
      </div>
    </div>

    <!-- Question card (hidden until start) -->
    <div class="card" id="questionCard" style="display:none;">
      <div class="section-title" id="questionTitle">Question</div>
      <div class="gentle-text" id="questionText" style="margin-top:8px; line-height:1.5;"></div>

      <textarea id="answerBox" rows="4" placeholder="Type here..." style="margin-top:14px;"></textarea>

      <div class="breathe-controls" style="margin-top:14px;">
        <button id="submitAnswer" class="small-pill" type="button">Next</button>
        <button id="skipQuestion" class="small-pill" type="button">Skip</button>
        <button id="endDistraction" class="small-pill completed-pill" type="button">Finish</button>
      </div>
    </div>
  </main>

  <nav class="bottom-nav">
    <a href="index.html"><div class="nav-ico">🏠</div><span>Home</span></a>
    <a href="breathe.html"><div class="nav-ico">🌬️</div><span>Breathe</span></a>
    <a href="journal.html"><div class="nav-ico">📖</div><span>Journal</span></a>
    <a href="quotes.html"><div class="nav-ico">💬</div><span>Quotes</span></a>
    <a href="yoga.html"><div class="nav-ico">🧘‍♀️</div><span>Yoga</span></a>
    <a href="sounds.html"><div class="nav-ico">🎵</div><span>Music</span></a>
    <a href="progress.html"><div class="nav-ico">📈</div><span>Progress</span></a>
  </nav>

  <script src="app.js?v=20260210d1" defer></script>
  <script src="distraction.js?v=20260210d1" defer></script>
</body>
</html>
