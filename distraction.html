<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Distraction • Enigma Wellbeing</title>

  <link rel="icon" href="icon.png" />
  <link rel="apple-touch-icon" href="icon.png" />
  <link rel="stylesheet" href="style.css?v=91000" />
</head>

<body class="page-wrap">
  <button id="themeFab" class="theme-toggle-top" type="button">🌙</button>

  <header class="page-header">
    <button class="back-btn" type="button" onclick="enigmaHome()">←</button>
    <h1>Distraction</h1>
    <p>Gentle questions to interrupt a spiral</p>
  </header>

  <main class="page" id="distractionPage">
    <div class="card">
      <div class="section-title">Take it one step at a time</div>

      <div id="distractionQuestion" class="distraction-question">Tap Start to begin.</div>

      <div class="gentle-text" style="margin-top:10px;">
        Answered: <b><span id="distractionAnsweredCount">0</span></b>
      </div>

      <div id="distractionInputWrap" style="display:none; margin-top:10px;">
        <input id="distractionInput" class="input" type="text" placeholder="Type your answer here…" autocomplete="off" />
        <div class="gentle-text" style="margin-top:8px;">
          Next requires typing. Skip if you’d rather not answer.
        </div>
      </div>

      <div class="tool-row" style="margin-top:12px;">
        <button class="tool-btn primary" id="distractionStartBtn" type="button">Start</button>
        <button class="tool-btn" id="distractionNextBtn" type="button" style="display:none;">Next</button>
        <button class="tool-btn" id="distractionSkipBtn" type="button" style="display:none;">Skip</button>
        <button class="tool-btn danger" id="distractionEndBtn" type="button" style="display:none;">End</button>
      </div>
    </div>
  </main>

  <nav class="bottom-nav">
    <a href="index.html"><div class="nav-ico">🏠</div><span>Home</span></a>

    <a href="yoga.html"><div class="nav-ico">🧘‍♀️</div><span>Yoga</span></a>
    <a href="sounds.html"><div class="nav-ico">🎵</div><span>Music</span></a>
    <a href="progress.html"><div class="nav-ico">📈</div><span>Progress</span></a>
  </nav>

  <script src="app.js?v=91000" defer></script>
</body>
</html>
