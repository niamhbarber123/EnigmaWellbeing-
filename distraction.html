<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Distraction • Enigma Wellbeing</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body class="page-wrap">
  <button id="themeFab" class="theme-toggle-top">🌙</button>

  <header class="page-header">
    <button class="back-btn" onclick="enigmaHome()">←</button>
    <h1>Distraction</h1>
    <p>Gentle grounding questions</p>
  </header>

  <main class="page">
    <div class="card" id="distractionCard">
      <div id="distractionQuestion" class="distraction-question">
        Tap Start to begin.
      </div>

      <div class="gentle-text">
        Answered: <b><span id="distractionAnsweredCount">0</span></b>
      </div>

      <div id="distractionInputWrap" style="display:none;">
        <input id="distractionInput" class="input" placeholder="Type your answer…" />
      </div>

      <div class="tool-row">
        <button class="tool-btn primary" id="distractionStartBtn">Start</button>
        <button class="tool-btn" id="distractionNextBtn" style="display:none;">Next</button>
        <button class="tool-btn" id="distractionSkipBtn" style="display:none;">Skip</button>
        <button class="tool-btn danger" id="distractionEndBtn" style="display:none;">End</button>
      </div>
    </div>
  </main>

  <script src="app.js" defer></script>
</body>
</html>
