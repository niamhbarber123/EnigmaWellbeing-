<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Distraction • Enigma Wellbeing</title>

  <link rel="icon" href="icon.png" />
  <link rel="apple-touch-icon" href="icon.png" />
  <link rel="stylesheet" href="style.css?v=100001" />
</head>

<body class="page-wrap distraction-page">
  <button id="themeFab" class="theme-toggle-top" type="button" aria-label="Toggle night mode">🌙</button>

  <header class="page-header">
    <button class="back-btn" type="button" onclick="enigmaHome()">←</button>
    <h1>Distraction</h1>
    <p>Gentle questions to interrupt a spiral</p>
  </header>

  <main class="page" id="distractionPage">
    <div class="card">
      <div class="gentle-text">Type any answer to continue — or Skip. Progress counts only answered.</div>

      <div id="dQuestion" class="distraction-question">Tap Start to begin.</div>

      <div class="gentle-text" style="margin-top:10px;">
        Answered: <b><span id="dAnswered">0</span></b>
      </div>

      <input id="dInput" class="input" type="text" placeholder="Type your answer here…" autocomplete="off" style="margin-top:10px; display:none;" />

      <div class="tool-row" style="margin-top:12px;">
        <button class="tool-btn primary" id="dStart" type="button">Start</button>
        <button class="tool-btn" id="dNext" type="button" style="display:none;">Next</button>
      </div>

      <div class="tool-row">
        <button class="tool-btn" id="dSkip" type="button" style="display:none;">Skip</button>
        <button class="tool-btn danger" id="dEnd" type="button" style="display:none;">End</button>
      </div>
    </div>
  </main>

  <nav class="bottom-nav">

    <a href="sounds.html"><div class="nav-ico">🎵</div><span>Music</span></a>
    <a href="progress.html"><div class="nav-ico">📈</div><span>Progress</span></a>
  </nav>

  <script src="app.js?v=100001" defer></script>
</body>
</html>
