<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resources • Enigma</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#c8baff">
  <link rel="apple-touch-icon" href="icon.png">
</head>

<body>
  <div class="watermark" aria-hidden="true"></div>
  <main class="wrap">
    <div class="topbar">
      <a class="back" href="index.html" data-back>← Back</a>
      <button class="moon" data-theme-toggle aria-label="Night mode">🌙</button>
    </div>

    <h1 class="page-title">Resources</h1>
    <p class="page-sub">Trusted NHS information pages.</p>

    <section class="card">
      <div class="grid">
        <a class="tile" target="_blank" rel="noopener" href="https://www.nhs.uk/mental-health/conditions/depression/">
          <div class="ico">🌧️</div><div class="label small">Depression</div><div class="arrow small">›</div>
        </a>
        <a class="tile" target="_blank" rel="noopener" href="https://www.nhs.uk/mental-health/conditions/generalised-anxiety-disorder/">
          <div class="ico">😟</div><div class="label small">Anxiety</div><div class="arrow small">›</div>
        </a>
        <a class="tile" target="_blank" rel="noopener" href="https://www.nhs.uk/mental-health/feelings-symptoms-behaviours/feelings-and-symptoms/stress-anxiety/">
          <div class="ico">⚠️</div><div class="label small">Stress</div><div class="arrow small">›</div>
        </a>
        <a class="tile" target="_blank" rel="noopener" href="https://www.nhs.uk/mental-health/conditions/borderline-personality-disorder/">
          <div class="ico">🧠</div><div class="label small">BPD</div><div class="arrow small">›</div>
        </a>
        <a class="tile" target="_blank" rel="noopener" href="https://www.nhs.uk/mental-health/conditions/post-traumatic-stress-disorder-ptsd/">
          <div class="ico">🛡️</div><div class="label small">PTSD</div><div class="arrow small">›</div>
        </a>
        <a class="tile" target="_blank" rel="noopener" href="https://www.nhs.uk/mental-health/feelings-symptoms-behaviours/feelings-and-symptoms/self-harm/">
          <div class="ico">🩹</div><div class="label small">Self-harm</div><div class="arrow small">›</div>
        </a>
      </div>

      <p style="margin:10px 0 0;color:var(--muted);font-weight:650;">
        Resources are information pages. If you need urgent help, use Help.
      </p>
    </section>
  </main>

  <script type="module">
    import { applySavedTheme, wireThemeButton, wireBackButton, registerServiceWorker } from "./app.js";
    applySavedTheme(); wireThemeButton(); wireBackButton(); registerServiceWorker();
  </script>
</body>
</html>
