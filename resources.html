<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Resources • Enigma Wellbeing</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />

  <style>
    .list{ display:flex; flex-direction:column; gap:12px; }
    .tile{ width:100%; min-height:84px; align-items:flex-start; }
    .tile-sub{ margin-top:2px; font-size:13px; }
  </style>
</head>
<body>
  <div class="watermark" aria-hidden="true"></div>
  <main class="wrap">
    <div class="topbar">
      <a class="back" href="index.html">←</a>
      <div style="width:44px;"></div>
    </div>

    <h1 class="page-title">Resources</h1>
    <p class="page-sub">NHS information on mental health and conditions.</p>

    <section class="card">
      <div class="list">
        <a class="tile" href="https://www.nhs.uk/mental-health/conditions/clinical-depression/" target="_blank" rel="noopener">
          <div class="ico">🌧️</div><div style="flex:1;">
            <div class="label small">Depression</div><div class="tile-sub">Symptoms, treatment and support.</div>
          </div><div class="arrow small">›</div>
        </a>

        <a class="tile" href="https://www.nhs.uk/mental-health/conditions/generalised-anxiety-disorder/" target="_blank" rel="noopener">
          <div class="ico">😟</div><div style="flex:1;">
            <div class="label small">Anxiety</div><div class="tile-sub">Understanding anxiety and help options.</div>
          </div><div class="arrow small">›</div>
        </a>

        <a class="tile" href="https://www.nhs.uk/mental-health/conditions/self-harm/" target="_blank" rel="noopener">
          <div class="ico">🩹</div><div style="flex:1;">
            <div class="label small">Self-harm</div><div class="tile-sub">Why it happens and how to get help.</div>
          </div><div class="arrow small">›</div>
        </a>

        <a class="tile" href="https://www.nhs.uk/mental-health/conditions/borderline-personality-disorder/" target="_blank" rel="noopener">
          <div class="ico">🫧</div><div style="flex:1;">
            <div class="label small">Borderline personality disorder</div><div class="tile-sub">Symptoms and treatment.</div>
          </div><div class="arrow small">›</div>
        </a>
      </div>
    </section>
  </main>

  <script type="module">
    import { applySavedTheme, applySavedPreferences } from "./app.js";
    applySavedTheme(); applySavedPreferences();
  </script>
</body>
</html>
