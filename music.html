<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Music • Enigma</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#c8baff">
  <link rel="apple-touch-icon" href="icon.png">

  <style>
    .media-tile{ min-height: 110px; flex-direction:column; justify-content:center; text-align:center; }
    .media-tile .label.small{ font-size:16px; }
    .media-tile .ico{ width:46px;height:46px; }
  </style>
</head>

<body>
  <div class="watermark" aria-hidden="true"></div>
  <main class="wrap">
    <div class="topbar">
      <a class="back" href="index.html" data-back>← Back</a>
      <button class="moon" data-theme-toggle aria-label="Night mode">🌙</button>
    </div>

    <h1 class="page-title">Music</h1>
    <p class="page-sub">Pick a vibe. Tap to open.</p>

    <section class="card">
      <div class="grid">
        <a class="tile media-tile" target="_blank" rel="noopener" href="https://open.spotify.com/search/lofi%20beats">
          <div class="ico">🎧</div><div class="label small">Lo-fi focus</div>
        </a>
        <a class="tile media-tile" target="_blank" rel="noopener" href="https://open.spotify.com/search/peaceful%20piano">
          <div class="ico">🎹</div><div class="label small">Peaceful piano</div>
        </a>
        <a class="tile media-tile" target="_blank" rel="noopener" href="https://open.spotify.com/search/rain%20sounds">
          <div class="ico">🌧️</div><div class="label small">Rain sounds</div>
        </a>
        <a class="tile media-tile" target="_blank" rel="noopener" href="https://open.spotify.com/search/ocean%20waves">
          <div class="ico">🌊</div><div class="label small">Ocean waves</div>
        </a>
        <a class="tile media-tile" target="_blank" rel="noopener" href="https://open.spotify.com/search/white%20noise">
          <div class="ico">📻</div><div class="label small">White noise</div>
        </a>
        <a class="tile media-tile" target="_blank" rel="noopener" href="https://open.spotify.com/search/binaural%20beats%20sleep">
          <div class="ico">🌀</div><div class="label small">Sleep tones</div>
        </a>
      </div>

      <p style="margin:10px 0 0;color:var(--muted);font-weight:650;">Links open in Spotify (or browser).</p>
    </section>
  </main>

  <script type="module">
    import { applySavedTheme, wireThemeButton, wireBackButton, registerServiceWorker } from "./app.js";
    applySavedTheme(); wireThemeButton(); wireBackButton(); registerServiceWorker();
  </script>
</body>
</html>
