<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Music • Enigma Wellbeing</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />

  <style>
    .list{ display:flex; flex-direction:column; gap:12px; }
    .tile{ width:100%; min-height:92px; align-items:flex-start; }
    .tile-sub{ margin-top:2px; font-size:13px; }
  </style>
</head>
<body>
  <div class="watermark" aria-hidden="true"></div>
  <main class="wrap">
    <div class="topbar">
      <a class="back" href="index.html">←</a>
      <div style="width:44px;"></div>
    </div>

    <h1 class="page-title">Music</h1>
    <p class="page-sub">Choose a sound that feels steady.</p>

    <section class="card">
      <div class="list">
        <a class="tile" href="https://www.youtube.com/results?search_query=rain+sounds+for+sleep" target="_blank" rel="noopener">
          <div class="ico">🌧️</div><div style="flex:1;">
            <div class="label small">Rain</div><div class="tile-sub">Steady rain sounds.</div>
          </div><div class="arrow small">›</div>
        </a>

        <a class="tile" href="https://www.youtube.com/results?search_query=ocean+waves+sounds" target="_blank" rel="noopener">
          <div class="ico">🌊</div><div style="flex:1;">
            <div class="label small">Ocean</div><div class="tile-sub">Waves, slow and even.</div>
          </div><div class="arrow small">›</div>
        </a>

        <a class="tile" href="https://www.youtube.com/results?search_query=brown+noise" target="_blank" rel="noopener">
          <div class="ico">🟤</div><div style="flex:1;">
            <div class="label small">Brown noise</div><div class="tile-sub">Deeper, grounding noise.</div>
          </div><div class="arrow small">›</div>
        </a>

        <a class="tile" href="https://www.youtube.com/results?search_query=soft+piano+ambient" target="_blank" rel="noopener">
          <div class="ico">🎹</div><div style="flex:1;">
            <div class="label small">Soft piano</div><div class="tile-sub">Quiet, simple piano.</div>
          </div><div class="arrow small">›</div>
        </a>
      </div>
    </section>
  </main>

  <script type="module">
    import { applySavedTheme, applySavedPreferences } from "./app.js";
    applySavedTheme(); applySavedPreferences();
  </script>
</body>
</html>
