<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Mood • Enigma Wellbeing</title>

  <link rel="icon" href="icon.png" />
  <link rel="apple-touch-icon" href="icon.png" />
  <link rel="stylesheet" href="style.css?v=20260209-final" />
</head>

<body class="page-wrap">
  <button class="back-btn" type="button" onclick="location.href='index.html'">←</button>
  <button id="themeFab" class="theme-toggle-top" type="button" aria-label="Toggle night mode">🌙</button>

  <header class="page-header">
    <h1>Mood</h1>
    <p>Select a mood and write about it</p>
  </header>

  <main class="page">
    <section class="card">
      <div class="section-title">How are you feeling?</div>
      <div class="chip-row" id="moodChips"></div>
    </section>

    <section class="card" style="margin-top:14px;">
      <div class="section-title">Write</div>
      <div class="gentle-text" style="margin-top:6px;">A few lines is enough.</div>
      <textarea id="moodText" rows="6" style="margin-top:12px;" placeholder="What’s going on for you right now?"></textarea>

      <div class="row" style="margin-top:12px;">
        <button id="saveMood" class="btn primary" type="button">Save</button>
        <button id="clearMood" class="btn" type="button">Clear</button>
      </div>
    </section>

    <section class="card" style="margin-top:14px;">
      <div class="section-title">Recent</div>
      <div class="gentle-text" style="margin-top:6px;">Last 7 entries.</div>
      <div id="moodList" style="margin-top:12px;"></div>
    </section>
  </main>

  <nav class="bottom-nav">
    <a href="index.html"><div class="nav-ico">🏠</div><span>Home</span></a>
    <a href="breathe.html"><div class="nav-ico">🌬️</div><span>Breathe</span></a>
    <a href="journal.html"><div class="nav-ico">📖</div><span>Journal</span></a>
    <a href="quotes.html"><div class="nav-ico">💬</div><span>Quotes</span></a>
    <a href="yoga.html"><div class="nav-ico">🧘‍♀️</div><span>Yoga</span></a>
    <a href="sounds.html"><div class="nav-ico">🎵</div><span>Music</span></a>
    <a href="progress.html"><div class="nav-ico">📈</div><span>Progress</span></a>
  </nav>

  <script src="app.js?v=20260209-final" defer></script>
  <script src="mood.js?v=20260209-final" defer></script>
</body>
</html>
